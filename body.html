<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>からだ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.hbtn{background:var(--surface);border-radius:999px;padding:8px 12px;box-shadow:var(--shadow);font-size:18px}
/* 今日の体重 */
.hero{text-align:center;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:var(--grad);opacity:.12}
.hero > *{position:relative}
.wbig{font-size:52px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.wbig small{font-size:18px;color:var(--sub);margin-left:4px}
.wsub{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--sub);margin-top:6px}
.wsub b{color:var(--ink)}
.down{color:var(--ok)!important} .up{color:var(--warn)!important}
.hidden-box{padding:10px 0 4px}
.hidden-box p{margin:0 0 10px;font-weight:700;color:var(--sub)}
.peek{background:var(--surface);border-radius:999px;padding:10px 20px;font-weight:900;box-shadow:var(--shadow)}
.entry{display:flex;gap:8px;align-items:center;margin-top:16px}
.entry .step{width:46px;height:46px;flex:none;border-radius:50%;background:var(--surface);font-size:22px;font-weight:900;box-shadow:var(--shadow)}
.entry input{flex:1;min-width:0;text-align:center;font-size:22px;font-weight:900;border:2px solid var(--line);border-radius:16px;padding:9px;background:var(--surface);outline:none}
.entry input:focus{border-color:var(--accent)}
.entry .big{width:auto;padding:12px 18px;flex:none}
.recorded{margin-top:10px;font-size:13px;font-weight:700;color:var(--ok)}

/* 目標 */
.goalbar{height:12px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0}
.goalbar i{display:block;height:100%;background:var(--grad);border-radius:999px}
.gline{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--sub)}
.gnote{font-size:14px;font-weight:700;margin-top:8px}
.bmi{display:inline-block;background:var(--c3);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;margin-left:6px}

/* グラフ */
.ranges{display:flex;gap:6px}
.ranges button{background:var(--c1);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700}
.ranges button.on{background:var(--grad);color:#fff}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:inherit;font-size:10px;fill:var(--sub);font-weight:700}
.legend{display:flex;gap:12px;font-size:11px;color:var(--sub);font-weight:700;margin-top:4px}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:4px}

/* 今日のからだ */
.btiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btile{background:var(--c1);border-radius:18px;padding:11px 13px;text-align:left;position:relative}
.btile small{color:var(--sub);font-weight:700;font-size:12px;display:block}
.btile b{font-size:19px;font-weight:900}
.btile b.none{color:var(--sub);font-size:15px}
.btile .plus{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:50%;background:var(--grad);color:#fff;font-weight:900;font-size:18px}

.ins{background:var(--c1);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:700;margin-bottom:8px;line-height:1.5}
.ins:last-child{margin-bottom:0}
.hist .row{cursor:pointer}
.hist .v{font-size:13px;color:var(--sub);font-weight:700;text-align:right}

.fl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-weight:700;font-size:15px}
.fl.col{flex-direction:column;align-items:stretch}
.fl input{border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:transparent;font-size:16px;outline:none;width:110px;text-align:right}
.fl input[type=text]{width:100%;text-align:left}
.fl input:focus{border-color:var(--accent)}
.numw{display:flex;align-items:center;gap:6px;color:var(--sub)}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line);font-weight:700}
.setrow small{display:block;color:var(--sub);font-size:12px;font-weight:500}
.tog{width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog.on{background:var(--pink)}
.tog.on::after{transform:translateX(22px)}
.danger{width:100%;margin-top:10px;padding:12px;color:var(--warn);font-weight:700}
.sheet h4{margin:18px 0 6px;font-size:14px;color:var(--sub)}

/* からだ／ごはん の切り替え */
.views{display:flex;gap:6px;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow);margin-bottom:14px}
.views button{flex:1;padding:9px 0;border-radius:999px;font-weight:900;font-size:15px;color:var(--sub)}
.views button.on{background:var(--grad);color:#fff}

/* ごはん */
.daynav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:12px}
.daynav button{width:36px;height:36px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);font-weight:900;font-size:16px}
.daynav button:disabled{opacity:.3}
.daynav b{min-width:120px;text-align:center}
.kc{font-size:44px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.kc small{font-size:16px;color:var(--sub);margin-left:4px}
.kleft{font-size:14px;font-weight:700;color:var(--sub);margin:2px 0 10px}
.kleft b{color:var(--pink)} .kleft .over{color:var(--warn)}
.bar{height:12px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--grad)}
.bar i.over{background:var(--warn)}
.pfc{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px;text-align:left}
.pfc small{display:block;font-size:12px;font-weight:700;color:var(--sub)}
.pfc b{font-size:15px}
.pfc .bar{height:8px;margin-top:4px}
.pfc .p i{background:#ff8cc0} .pfc .f i{background:#ffc37a} .pfc .c i{background:#b896ff}
.pfc .bar i.over{background:var(--warn)}
.goalset{font-size:12px;color:var(--pink);font-weight:700;margin-top:10px}
.meal{padding:10px 0;border-bottom:1px dashed var(--line)}
.meal:last-child{border:0}
.meal h4{margin:0;display:flex;align-items:center;gap:8px;font-size:15px}
.meal h4 span{flex:1}
.meal h4 small{color:var(--sub);font-weight:700}
.meal h4 button{width:32px;height:32px;border-radius:50%;background:var(--grad);color:#fff;font-weight:900;font-size:18px;flex:none}
.fitem{display:flex;align-items:center;gap:8px;padding:7px 0 0 4px;font-size:14px;cursor:pointer}
.fitem .n{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem .n small{color:var(--sub);font-weight:700;margin-left:4px}
.fitem .k{color:var(--sub);font-weight:700;font-size:13px;flex:none}
.copy{font-size:12px;color:var(--pink);font-weight:700;margin-top:6px}
.wbars{display:flex;align-items:flex-end;gap:8px;height:120px;position:relative;margin-top:6px}
.wbars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;font-weight:700;color:var(--sub)}
.wbars .col i{display:block;width:70%;border-radius:8px 8px 4px 4px;background:var(--grad);min-height:2px}
.wbars .col i.over{background:var(--warn)}
.wbars .col.today{color:var(--pink)}
.wbars .gl{position:absolute;left:0;right:0;border-top:2px dashed var(--ok);pointer-events:none}
/* 追加シート */
.mealtabs{display:flex;gap:6px;margin-bottom:10px}
.mealtabs button{flex:1;padding:7px 0;border-radius:999px;background:var(--c1);font-size:13px;font-weight:700}
.mealtabs button.on{background:var(--grad);color:#fff}
.fsearch{width:100%;margin-bottom:10px}
.fres{max-height:46vh;overflow-y:auto}
.fres h5{margin:8px 0 4px;font-size:12px;color:var(--sub)}
.fopt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:14px;background:var(--c1);margin-bottom:6px;transition:background .2s}
.fopt.added{background:var(--c3)}
.fopt .e{font-size:22px}
.fopt .n{flex:1;min-width:0;font-weight:700;font-size:14px}
.fopt .n small{display:block;font-size:11px;color:var(--sub)}
.fopt .k{font-weight:900;font-size:13px;flex:none}
.photo-btn{width:100%;padding:13px;border-radius:16px;background:var(--grad);color:#fff;font-weight:900;font-size:15px;margin-bottom:10px;box-shadow:0 6px 16px rgba(255,111,168,.25)}
.pv{width:100%;max-height:220px;object-fit:cover;border-radius:18px;display:block;margin-bottom:12px}
.ploading{text-align:center;padding:18px 0;font-weight:700;color:var(--sub)}
.ploading .dot{display:inline-block;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.pitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;background:var(--c1);margin-bottom:6px}
.pitem.off{opacity:.4}
.pitem .e{font-size:22px}
.pitem .n{flex:1;min-width:0;font-weight:700;font-size:14px}
.pitem .n small{display:block;font-size:11px;color:var(--sub)}
.pitem .k{font-weight:900;font-size:13px}
.pitem .ck2{width:24px;height:24px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;font-size:13px;color:#fff;flex:none}
.pitem:not(.off) .ck2{background:var(--ok);border-color:var(--ok)}
.pcomment{background:var(--c4);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:700;margin:8px 0}
.fopt .fav{font-size:18px;color:var(--star);padding:0 2px;flex:none}
.qty{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.qty button{background:var(--c1);border-radius:999px;padding:8px 14px;font-weight:700}
.qty button.on{background:var(--grad);color:#fff}
.cform{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cform input{width:100%}
.cform .wide{grid-column:1 / -1}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{background:var(--c1);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.presets button.on{background:var(--grad);color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="brand">My Body</div><small id="date"></small><h1>からだ</h1></div>
    <button id="setBtn" class="hbtn" aria-label="設定">⚙️</button>
  </header>

  <div class="views" id="views"><button data-view="body" class="on">⚖️ からだ</button><button data-view="food">🍽 ごはん</button></div>

  <div id="viewFood" hidden>
    <div class="daynav"><button data-fday="-1" aria-label="前の日">‹</button><b id="fDay">今日</b><button data-fday="1" aria-label="次の日">›</button></div>
    <section class="card hero" id="fSum"></section>
    <section class="card mini" id="fMeals"></section>
    <section class="card mini" id="fWeek"></section>
  </div>

  <div id="viewBody">
  <section class="card hero" id="hero"></section>
  <section class="card mini" id="goal"></section>
  <section class="card mini">
    <h3>📈 体重のうつりかわり <span class="ranges" id="ranges"></span></h3>
    <div class="chart" id="chart"></div>
  </section>
  <section class="card mini">
    <h3>🌿 今日のからだ <button class="link" data-edit="today">まとめて記録</button></h3>
    <div class="btiles" id="btiles"></div>
  </section>
  <section class="card mini" id="period" hidden></section>
  <section class="card mini" id="summary"></section>
  <section class="card mini" id="insight"></section>
  <section class="card mini hist">
    <h3>🗒 きろく（タップで編集）</h3>
    <div id="hist"></div>
  </section>
  </div>
</div>

<!-- ごはんを追加 -->
<div id="addSheet" class="sheet-wrap" hidden>
  <div class="sheet">
    <h3 id="addTitle">ごはんを追加</h3>
    <div class="mealtabs" id="addMeals"></div>
    <button class="photo-btn" id="photoBtn">📸 写真から追加（AIが中身を推測）</button>
    <input type="file" id="photoIn" accept="image/*" hidden>
    <input class="tin fsearch" id="fq" placeholder="🔍 食べたものを検索（例：からあげ）" enterkeyhint="search">
    <div class="fres" id="fres"></div>
    <button class="pill" id="customBtn" style="width:100%;padding:11px;margin-top:8px">✏️ リストにないものを自分で入力</button>
    <div id="cformWrap" hidden>
      <div class="cform">
        <input class="tin wide" id="cName" placeholder="名前（例：手作りスムージー）">
        <input class="tin" id="cKcal" type="number" inputmode="decimal" placeholder="kcal">
        <input class="tin" id="cUnit" placeholder="量（例：1杯）">
        <input class="tin" id="cP" type="number" inputmode="decimal" placeholder="たんぱく質 g">
        <input class="tin" id="cF" type="number" inputmode="decimal" placeholder="脂質 g">
        <input class="tin wide" id="cC" type="number" inputmode="decimal" placeholder="炭水化物 g">
      </div>
      <button class="big" id="cSave" style="margin-top:10px">保存して追加</button>
    </div>
    <button class="big" id="addDone" style="margin-top:12px">とじる</button>
  </div>
</div>

<!-- 写真から -->
<div id="photoSheet" class="sheet-wrap" hidden>
  <div class="sheet">
    <h3>📸 写真から追加</h3>
    <img class="pv" id="pv" alt="">
    <div id="pBody"></div>
  </div>
</div>

<!-- 記録したごはん -->
<div id="itemSheet" class="sheet-wrap" hidden>
  <div class="sheet">
    <h3 id="itemTitle"></h3>
    <p class="muted" id="itemInfo"></p>
    <div class="qty" id="itemQty"></div>
    <div class="mealtabs" id="itemMeals"></div>
    <button class="big" id="itemClose">OK</button>
    <button class="danger" id="itemDel">削除</button>
  </div>
</div>

<!-- ごはんの目標 -->
<div id="fSetSheet" class="sheet-wrap" hidden>
  <div class="sheet">
    <h3>🎯 ごはんの目標</h3>
    <div class="fl"><span>🔥 1日のカロリー</span><span class="numw"><input type="number" inputmode="numeric" id="fsKcal" placeholder="1800">kcal</span></div>
    <h4>バランス（たんぱく質・脂質・炭水化物）</h4>
    <div class="presets" id="fsPresets"></div>
    <p class="muted" style="font-size:12px;margin-top:10px">めやす：成人女性は1日 1,600〜2,000kcal、男性は 2,000〜2,600kcal くらい（活動量で変わるよ）</p>
    <button class="big" id="fsSave" style="margin-top:14px">保存</button>
  </div>
</div>

<!-- 1日の記録 -->
<div id="editSheet" class="sheet-wrap" hidden>
  <div class="sheet">
    <h3 id="editTitle">きろく</h3>
    <div id="editForm"></div>
    <button id="editSave" class="big" style="margin-top:16px">保存</button>
  </div>
</div>

<!-- 設定 -->
<div id="setSheet" class="sheet-wrap" hidden>
  <div class="sheet">
    <h3>⚙️ からだの設定</h3>
    <div class="fl"><span>📏 身長<small style="display:block;color:var(--sub);font-size:12px">BMIの計算に使うよ</small></span><span class="numw"><input type="number" inputmode="decimal" step="0.1" id="sHeight" placeholder="160">cm</span></div>
    <div class="fl"><span>🎯 目標体重</span><span class="numw"><input type="number" inputmode="decimal" step="0.1" id="sGoal" placeholder="50.0">kg</span></div>
    <div class="setrow"><span>👀 数字をふだん隠す<small>オンにすると、タップしたときだけ体重が見える</small></span><button class="tog" id="sHide"></button></div>
    <h4>記録する項目</h4>
    <div id="sFields"></div>
    <h4>データ</h4>
    <button class="pill" id="csvBtn" style="width:100%;padding:12px">📤 からだの記録を書き出す（CSV）</button>
    <button id="setSave" class="big" style="margin-top:16px">保存</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="shared.js"></script>
<script src="food-db.js"></script>
<script>
const S_KEY = 'body:settings', R_KEY = 'body:records';
const FIELDS = [
  { k: 'fat', label: '体脂肪率', icon: '🫧', unit: '%', step: '0.1', type: 'num', ph: '25.0' },
  { k: 'waist', label: 'ウエスト', icon: '📏', unit: 'cm', step: '0.5', type: 'num', ph: '65' },
  { k: 'steps', label: '歩数', icon: '👟', unit: '歩', step: '100', type: 'num', ph: '8000' },
  { k: 'water', label: '水分', icon: '💧', unit: '杯', step: '1', type: 'count' },
  { k: 'period', label: '生理', icon: '🌸', type: 'pick', opts: ['なし', '少なめ', 'ふつう', '多め'], emo: ['⚪️', '🌸', '🌺', '🌹'] },
  { k: 'memo', label: 'メモ', icon: '✏️', type: 'text', ph: '例：外食が多かった' }
];
const DEF = { height: null, goal: null, goalFrom: null, hide: true, fields: ['fat', 'waist', 'steps', 'water', 'memo'] };
const settings = () => Object.assign({}, DEF, load(S_KEY, {}));
const recs = () => load(R_KEY, {});
const mrecs = () => load('morning:records', {});
const fieldOn = k => settings().fields.includes(k);

// 日付の計算
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d).getTime(); };
const addKey = (k, n) => { const d = new Date(parseKey(k)); d.setDate(d.getDate() + n); return dayKey(d); };
const diffDays = (a, b) => Math.round((parseKey(b) - parseKey(a)) / DAY);
const md = k => { const [, m, d] = k.split('-').map(Number); return `${m}/${d}`; };

// 体重は朝のきろく（morning:records）と同じ場所に入れる
const weightOf = k => { const m = mrecs()[k]; return m && m.weight != null ? +m.weight : null; };
function setWeight(k, w) {
  const all = mrecs(), r = all[k] || {};
  if (w == null || isNaN(w)) delete r.weight; else r.weight = Math.round(w * 10) / 10;
  all[k] = r; store('morning:records', all);
}
const weightKeys = () => Object.keys(mrecs()).filter(k => weightOf(k) != null).sort();
function avg7(k) { const a = []; for (let i = 0; i < 7; i++) { const w = weightOf(addKey(k, -i)); if (w != null) a.push(w); } return a.length ? avg(a) : null; }
function avgRange(from, to) { const a = []; for (let i = from; i <= to; i++) { const w = weightOf(keyOf(-i)); if (w != null) a.push(w); } return a.length ? avg(a) : null; }
function lastWeight() { const ks = weightKeys(); return ks.length ? { k: ks[ks.length - 1], w: weightOf(ks[ks.length - 1]) } : null; }
// ここ14日の流れ（1日あたり何kg）
function slope() {
  const p = [];
  for (let i = 0; i < 14; i++) { const w = weightOf(keyOf(-i)); if (w != null) p.push([-i, w]); }
  if (p.length < 5) return null;
  const mx = avg(p.map(x => x[0])), my = avg(p.map(x => x[1]));
  const num = p.reduce((a, [x, y]) => a + (x - mx) * (y - my), 0), den = p.reduce((a, [x]) => a + (x - mx) ** 2, 0);
  return den ? num / den : null;
}

// 隠す・見せる
let revealed = false;
const hidden = () => settings().hide && !revealed;
const fmtW = w => w == null ? '—' : hidden() ? '••.•' : w.toFixed(1);
function reveal(v) { revealed = v; render(); }
document.addEventListener('visibilitychange', () => { if (document.hidden) revealed = false; });

// ---------- 今日の体重 ----------
function renderHero() {
  const s = settings(), w = weightOf(today()), lw = lastWeight();
  const prev = (() => { for (let i = 1; i < 30; i++) { const x = weightOf(keyOf(-i)); if (x != null) return x; } return null; })();
  let html = '';
  if (hidden()) {
    html = `<div class="hidden-box"><p>⚖️ 体重は隠しているよ ${w != null ? '・ 今日は記録ずみ ✓' : ''}</p><button class="peek" data-act="peek">👀 タップで見る</button></div>`;
  } else if (w != null || lw) {
    const cur = w != null ? w : lw.w, a7 = avg7(today());
    const d = w != null && prev != null ? Math.round((w - prev) * 10) / 10 : null;
    let bmi = '';
    if (s.height) { const b = cur / ((s.height / 100) ** 2); bmi = `<span class="bmi">BMI ${b.toFixed(1)}（${b < 18.5 ? 'やせ' : b < 25 ? 'ふつう' : '高め'}）</span>`; }
    html = `<div class="wbig">${cur.toFixed(1)}<small>kg</small></div>
      <div class="wsub">${w == null ? `<span>${md(lw.k)}の記録</span>` : ''}${d != null ? `<span>前回より <b class="${d < 0 ? 'down' : d > 0 ? 'up' : ''}">${d > 0 ? '+' : ''}${d.toFixed(1)}</b></span>` : ''}
      ${a7 != null ? `<span>7日平均 <b>${a7.toFixed(1)}</b></span>` : ''}</div>${bmi ? `<div style="margin-top:6px">${bmi}</div>` : ''}
      ${s.hide ? '<button class="link" data-act="hide" style="margin-top:8px">🙈 隠す</button>' : ''}`;
  } else html = '<p class="muted" style="padding:8px 0">はじめての体重を記録しよう⚖️</p>';
  const val = hidden() ? null : w != null ? w : lw ? lw.w : null;
  html += `<div class="entry">
    ${hidden() ? '' : '<button class="step" data-step="-0.1">−</button>'}
    <input type="number" inputmode="decimal" step="0.1" id="wIn" placeholder="${hidden() ? '体重を入力' : '52.0'}" value="${val != null ? val.toFixed(1) : ''}">

  if (w != null) html += '<div class="recorded">✓ 今日の体重は記録ずみ（+5pt）</div>';
  $('#hero').innerHTML = html;
}

// ---------- 目標 ----------
function renderGoal() {
  const s = settings(), lw = lastWeight();
  if (!s.goal) { $('#goal').innerHTML = '<h3>🎯 目標</h3><p class="muted">⚙️ で目標体重と身長を入れると、ゴールまでの道のりと予想日を出すよ</p>'; return; }
  if (!lw) { $('#goal').innerHTML = `<h3>🎯 目標 ${fmtW(s.goal)}kg</h3><p class="muted">体重を記録すると、ここに進み具合が出るよ</p>`; return; }
  const cur = avg7(lw.k) || lw.w, from = s.goalFrom || cur;
  const total = from - s.goal, done = from - cur;
  const pct = total ? Math.max(0, Math.min(100, Math.round(done / total * 100))) : 100;
  const left = Math.round((cur - s.goal) * 10) / 10;
  const sl = slope();
  let note = '';
  if (Math.abs(left) < 0.2) note = '🎉 目標に到着！おめでとう！';
  else if (sl != null && Math.abs(sl) > 0.005 && Math.sign(sl) === Math.sign(s.goal - cur)) {
    const days = Math.round((s.goal - cur) / sl), dt = new Date(sod(days));
    note = days < 400 ? `🔮 このペースだと <b>${dt.getMonth() + 1}月${dt.getDate()}日ごろ</b> に目標に届きそう（あと${days}日）` : '🔮 ゆっくり近づいてるよ。この調子で';
  } else if (sl != null) note = '🌿 ここ2週間は横ばい〜逆向き。あせらず、続けることが大事だよ';
  else note = '🔮 5日以上記録すると、目標に届く日を予想するよ';
  $('#goal').innerHTML = `<h3>🎯 目標 ${fmtW(s.goal)}kg</h3>
    <div class="goalbar"><i style="width:${pct}%"></i></div>
    <div class="gline"><span>スタート ${fmtW(from)}</span><span>${pct}%</span><span>あと ${hidden() ? '•.•' : Math.abs(left).toFixed(1)}kg</span></div>
    <div class="gnote">${note}</div>`;
}

// ---------- グラフ ----------
const RANGES = [['w', '1週', 7], ['m', '1か月', 30], ['q', '3か月', 90], ['y', '1年', 365]];
let range = load('body:range', 'm');
function renderChart() {
  $('#ranges').innerHTML = RANGES.map(([k, l]) => `<button data-range="${k}" class="${k === range ? 'on' : ''}">${l}</button>`).join('');
  if (hidden()) { $('#chart').innerHTML = '<p class="muted" style="text-align:center;padding:24px 0"><button class="peek" data-act="peek">👀 タップでグラフを見る</button></p>'; return; }
  const N = RANGES.find(r => r[0] === range)[2];
  const pts = [];
  for (let i = N - 1; i >= 0; i--) { const k = keyOf(-i), w = weightOf(k); if (w != null) pts.push({ x: N - 1 - i, w, k }); }
  if (pts.length < 2) { $('#chart').innerHTML = '<p class="muted">2日以上記録するとグラフが出るよ</p>'; return; }
  const av = pts.map(p => ({ x: p.x, w: avg7(p.k) }));
  let mn = Math.min(...pts.map(p => p.w)), mx = Math.max(...pts.map(p => p.w));
  const g = settings().goal;
  if (g && Math.abs(g - (mn + mx) / 2) < 6) { mn = Math.min(mn, g); mx = Math.max(mx, g); }
  mn -= .3; mx += .3;
  const W = 320, H = 170, L = 34, R = 8, T = 10, B = 22;
  const X = x => L + x / (N - 1) * (W - L - R), Y = w => T + (mx - w) / (mx - mn) * (H - T - B);
  let svg = `<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#b896ff"/><stop offset="1" stop-color="#ff8cc0"/></linearGradient></defs>`;
  for (let i = 0; i <= 2; i++) {
    const v = mn + (mx - mn) * i / 2, y = Y(v);
    svg += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L - 4}" y="${y + 3}" text-anchor="end">${v.toFixed(1)}</text>`;
  }
  if (g && g >= mn && g <= mx) svg += `<line x1="${L}" x2="${W - R}" y1="${Y(g)}" y2="${Y(g)}" stroke="#3bb88a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W - R}" y="${Y(g) - 4}" text-anchor="end" style="fill:#3bb88a">目標</text>`;
  if (N <= 90) pts.forEach(p => { svg += `<circle cx="${X(p.x)}" cy="${Y(p.w)}" r="${N <= 30 ? 3 : 2}" fill="#ff8cc0" opacity=".45"/>`; });
  svg += `<path d="${av.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ' ' + Y(p.w).toFixed(1)).join(' ')}" fill="none" stroke="url(#lg)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  const last = pts[pts.length - 1];
  svg += `<circle cx="${X(last.x)}" cy="${Y(last.w)}" r="4.5" fill="#ff6fa8"/>`;
  [0, Math.floor((N - 1) / 2), N - 1].forEach((x, i) => { svg += `<text x="${X(x)}" y="${H - 6}" text-anchor="${['start', 'middle', 'end'][i]}">${md(keyOf(-(N - 1 - x)))}</text>`; });
  svg += '</svg>';
  $('#chart').innerHTML = svg + '<div class="legend"><span><i style="background:#ff8cc0;opacity:.5"></i>毎日の体重</span><span><i style="background:linear-gradient(90deg,#b896ff,#ff8cc0)"></i>7日平均（ならした線）</span></div>';
}

// ---------- 生理 ----------
function periodInfo() {
  const r = recs(), on = k => r[k] && r[k].period > 0;
  const ks = Object.keys(r).filter(on).sort();
  if (!ks.length) return null;
  const starts = ks.filter(k => !on(addKey(k, -1)));
  const cycles = starts.slice(1).map((k, i) => diffDays(starts[i], k)).filter(d => d >= 20 && d <= 45);
  const len = cycles.length ? Math.round(avg(cycles)) : 28;
  const last = starts[starts.length - 1], next = addKey(last, len);
  const dayN = diffDays(last, today()) + 1;
  const ongoing = on(today()) || (on(addKey(today(), -1)) && dayN <= 8);
  return { last, next, len, dayN, ongoing, until: diffDays(today(), next), guess: !cycles.length };
}
function renderPeriod() {
  if (!fieldOn('period')) { $('#period').hidden = true; return; }
  $('#period').hidden = false;
  const p = periodInfo();
  if (!p) { $('#period').innerHTML = '<h3>🌸 生理</h3><p class="muted">「今日のからだ」から記録すると、次の予定日を予想するよ</p>'; return; }
  $('#period').innerHTML = `<h3>🌸 生理</h3>` + (p.ongoing ? `<p class="gnote">いま ${p.dayN}日目。あたたかくして、むりしないでね</p>` : '')
    + `<p class="gnote">次の予定：<b>${md(p.next)}ごろ</b>（${p.until > 0 ? `あと${p.until}日` : p.until === 0 ? '今日' : `${-p.until}日すぎ`}）</p>`
    + `<p class="muted" style="font-size:12px">${p.guess ? '周期は28日として予想中（2回記録すると、あなたの周期で予想するよ）' : `あなたの平均周期：${p.len}日`}</p>`;
}

// ---------- まとめ ----------
function renderSummary() {
  const tw = avgRange(0, 6), lw = avgRange(7, 13);
  const now = new Date(), mKeys = [];
  for (let d = 1; d <= now.getDate(); d++) mKeys.push(dayKey(new Date(now.getFullYear(), now.getMonth(), d)));
  const mw = mKeys.map(weightOf).filter(x => x != null);
  const r = recs();
  const st = []; for (let i = 0; i < 7; i++) { const v = (r[keyOf(-i)] || {}).steps; if (v != null) st.push(+v); }
  const wa = []; for (let i = 0; i < 7; i++) { const v = (r[keyOf(-i)] || {}).water; if (v) wa.push(+v); }
  const diff = tw != null && lw != null ? tw - lw : null;
  const tiles = [
    ['⚖️ 今週の平均', tw != null ? fmtW(tw) + 'kg' : '—', diff != null && !hidden() ? `<small class="${diff < 0 ? 'down' : diff > 0 ? 'up' : ''}">先週より ${diff > 0 ? '+' : ''}${diff.toFixed(1)}</small>` : ''],
    ['📅 今月の記録', `${mw.length}/${now.getDate()}日`, mw.length ? `<small>平均 ${fmtW(avg(mw))}kg</small>` : '']
  ];

  if (fieldOn('water')) tiles.push(['💧 水分（7日平均）', wa.length ? avg(wa).toFixed(1) + '杯' : '—', '']);
  $('#summary').innerHTML = '<h3>📊 まとめ</h3><div class="tiles">' + tiles.map(([l, v, x]) => `<div class="tile"><small>${l}</small><b>${v}</b>${x}</div>`).join('') + '</div>';
}

// ---------- 気づき ----------
function bodyInsights() {
  const out = [], ks = weightKeys();
  if (ks.length < 7) return { list: out, n: ks.length };
  const tw = avgRange(0, 6), lw = avgRange(7, 13);
  if (tw != null && lw != null) {
    const d = tw - lw;
    out.push(d <= -.2 ? `📉 先週より平均 ${hidden() ? '' : (-d).toFixed(1) + 'kg '}減ってるよ。いい流れ！`
      : d >= .2 ? `📈 先週より平均 ${hidden() ? '' : d.toFixed(1) + 'kg '}増えてるよ。むりせず、ゆるっと整えよう`
      : '➖ 先週とほぼ同じ。安定してるね');
  }
  // 曜日のくせ
  const dev = {};
  ks.slice(-90).forEach(k => { const a = avg7(k); if (a == null) return; const w = new Date(parseKey(k)).getDay(); (dev[w] = dev[w] || []).push(weightOf(k) - a); });
  let best = null;
  Object.keys(dev).forEach(w => { if (dev[w].length >= 3) { const v = avg(dev[w]); if (!best || v > best.v) best = { w, v }; } });
  if (best && best.v >= .25) out.push(`🗓 ${WD[best.w]}曜日は体重が高めに出やすいよ。前の日の過ごし方の影響かも`);
  // 歩数・ねむりと次の日の体重
  const r = recs(), mr = mrecs(), hi = [], lo = [], sh = [], sl = [];
  ks.forEach(k => {
    const n = addKey(k, 1), w0 = weightOf(k), w1 = weightOf(n);
    if (w1 == null) return;
    const ch = w1 - w0, steps = (r[k] || {}).steps;
    if (steps != null) (steps >= 8000 ? hi : lo).push(ch);
    const s = sleepH(mr[n]);
    if (s != null) (s >= 7 ? sh : sl).push(ch);
  });
  if (hi.length >= 3 && lo.length >= 3 && avg(hi) - avg(lo) <= -.15) out.push('👟 8000歩以上歩いた日の次の日は、体重が下がりやすいみたい');
  if (sh.length >= 3 && sl.length >= 3 && avg(sh) - avg(sl) <= -.15) out.push('🛌 7時間以上ねむれた日は、体重が下がりやすいみたい。ねむりも大事！');
  // 記録の続き
  let streak = 0; while (weightOf(keyOf(-streak)) != null) streak++;
  if (streak >= 3) out.push(`🔥 ${streak}日連続で記録してる！はかり続けるだけで、整いやすくなるよ`);
  return { list: out.slice(0, 4), n: ks.length };
}
function renderInsight() {
  const { list, n } = bodyInsights();
  $('#insight').innerHTML = '<h3>💡 気づき</h3>' + (list.length ? list.map(x => `<div class="ins">${x}</div>`).join('')
    : `<p class="muted">体重が7日分たまると、あなたのからだのパターンを見つけるよ（いま${n}日分）</p>`);
}

    rows.push(`<div class="row" data-edit="${k}"><div class="t">${i === 0 ? '今日' : dateLabel(k)}</div><div class="v">${bits.join(' ') || '＋ 記録する'}</div></div>`);

}

document.querySelectorAll('.sheet-wrap').forEach(w => w.addEventListener('click', e => { if (e.target === w) w.hidden = true; }));


// ================= 🍽 ごはん =================
const F_LOG = 'food:log', F_CUSTOM = 'food:custom', F_SET = 'food:settings';
const MEALS = [['b', '🌅', '朝ごはん'], ['l', '☀️', '昼ごはん'], ['d', '🌙', '夜ごはん'], ['s', '🍪', '間食']];
const QTYS = [[0.5, '半分'], [1, '1人前'], [1.5, '1.5倍'], [2, '2倍'], [3, '3倍']];
const PRESETS = [['bal', 'バランス', 15, 25, 60], ['pro', '高たんぱく', 30, 25, 45], ['low', '糖質ひかえめ', 25, 35, 40]];
const foodLog = () => load(F_LOG, {});
const fSet = () => Object.assign({ kcal: 1800, preset: 'bal' }, load(F_SET, {}));
function goals() {
  const s = fSet(), pr = PRESETS.find(x => x[0] === s.preset) || PRESETS[0];
  return { kcal: s.kcal, p: s.kcal * pr[2] / 100 / 4, f: s.kcal * pr[3] / 100 / 9, c: s.kcal * pr[4] / 100 / 4 };
}
const hira = s => String(s).replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60)).toLowerCase().replace(/\s/g, '');
const totals = list => list.reduce((a, x) => ({ kcal: a.kcal + x.kcal * x.qty, p: a.p + x.p * x.qty, f: a.f + x.f * x.qty, c: a.c + x.c * x.qty }), { kcal: 0, p: 0, f: 0, c: 0 });
const r0 = n => Math.round(n), r1 = n => Math.round(n * 10) / 10;
const mealNow = () => { const h = new Date().getHours() + new Date().getMinutes() / 60; return h < 10.5 ? 'b' : h < 15 ? 'l' : h < 17 ? 's' : 'd'; };
let fOff = 0;   // 0=今日, -1=昨日 ...
const fDayKey = () => keyOf(fOff);
const dayItems = k => foodLog()[k] || [];

function addFood(k, meal, it, qty) {
  const all = foodLog();
  (all[k] = all[k] || []).push({ id: uid(), meal, emoji: it.emoji || '🍽', name: it.name, unit: it.unit || '', kcal: +it.kcal || 0, p: +it.p || 0, f: +it.f || 0, c: +it.c || 0, qty: qty || 1, at: Date.now() });
  store(F_LOG, all);
}
function updateItem(k, id, patch) {
  const all = foodLog(), x = (all[k] || []).find(i => i.id === id);
  if (x) { Object.assign(x, patch); store(F_LOG, all); }
}
function removeItem(k, id) { const all = foodLog(); all[k] = (all[k] || []).filter(i => i.id !== id); store(F_LOG, all); }
// よく食べるもの：☆で固定したもの（最初はカフェラテ）→ 回数の多い順
const F_FAV = 'food:fav';
const favs = () => load(F_FAV, ['カフェラテ']);
function toggleFav(name) {
  const f = favs(), on = f.includes(name);
  store(F_FAV, on ? f.filter(n => n !== name) : f.concat(name));
  toast(on ? `「${name}」をよく食べるから外したよ` : `⭐「${name}」をよく食べるに入れたよ`);
}
function frequent() {
  const cnt = {}, last = {};
  Object.values(foodLog()).forEach(list => list.forEach(x => { cnt[x.name] = (cnt[x.name] || 0) + 1; if (!last[x.name] || x.at > last[x.name].at) last[x.name] = x; }));
  const pinned = favs().map(n => last[n] || allFoods().find(x => x.name === n)).filter(Boolean);
  const names = new Set(pinned.map(x => x.name));
  return pinned.concat(Object.keys(cnt).filter(n => !names.has(n)).sort((a, b) => cnt[b] - cnt[a]).slice(0, 8).map(n => last[n]));
}
function allFoods() { return load(F_CUSTOM, []).concat(FOOD_DB); }
function searchFoods(q) {
  const h = hira(q);
  return allFoods().filter(x => hira(x.name + (x.alias || '')).includes(h)).slice(0, 40);
}

function renderFood() {
  const k = fDayKey(), items = dayItems(k), t = totals(items), g = goals();
  $('#fDay').textContent = fOff === 0 ? '今日' : fOff === -1 ? '昨日' : dateLabel(k);
  document.querySelector('[data-fday="1"]').disabled = fOff >= 0;
  const left = g.kcal - t.kcal, pct = Math.min(100, t.kcal / g.kcal * 100);
  const bar = (v, max, cls) => `<div class="bar ${cls || ''}"><i class="${v > max * 1.05 ? 'over' : ''}" style="width:${Math.min(100, v / max * 100)}%"></i></div>`;
  $('#fSum').innerHTML = `<div class="kc">${r0(t.kcal).toLocaleString()}<small>/ ${g.kcal.toLocaleString()} kcal</small></div>
    <div class="kleft">${left >= 0 ? `あと <b>${r0(left).toLocaleString()} kcal</b> 食べられるよ` : `<span class="over">${r0(-left).toLocaleString()} kcal オーバー</span>`}</div>
    <div class="bar"><i class="${t.kcal > g.kcal ? 'over' : ''}" style="width:${pct}%"></i></div>
    <div class="pfc">
      <div class="p"><small>たんぱく質</small><b>${r0(t.p)}</b><small style="display:inline"> / ${r0(g.p)}g</small>${bar(t.p, g.p)}</div>
      <div class="f"><small>脂質</small><b>${r0(t.f)}</b><small style="display:inline"> / ${r0(g.f)}g</small>${bar(t.f, g.f)}</div>
      <div class="c"><small>炭水化物</small><b>${r0(t.c)}</b><small style="display:inline"> / ${r0(g.c)}g</small>${bar(t.c, g.c)}</div>
    </div>
    <button class="goalset" data-act="fset">🎯 目標を変える</button>`;

  const yk = keyOf(fOff - 1), yItems = dayItems(yk);
  $('#fMeals').innerHTML = '<h3>🍽 食べたもの</h3>' + MEALS.map(([m, e, l]) => {
    const list = items.filter(x => x.meal === m), mt = totals(list);
    const ycopy = !list.length && yItems.some(x => x.meal === m) ? `<button class="copy" data-copy="${m}">↺ ${fOff === 0 ? '昨日' : '前の日'}と同じにする</button>` : '';
    return `<div class="meal"><h4>${e} <span>${l}</span>${list.length ? `<small>${r0(mt.kcal)} kcal</small>` : ''}<button data-add="${m}" aria-label="${l}に追加">＋</button></h4>
      ${list.map(x => `<div class="fitem" data-item="${x.id}"><span>${esc(x.emoji)}</span><span class="n">${esc(x.name)}<small>${x.qty !== 1 ? '×' + x.qty : ''}</small></span><span class="k">${r0(x.kcal * x.qty)} kcal</span></div>`).join('')}${ycopy}</div>`;
  }).join('');

  // 7日のグラフ
  const days = []; for (let i = 6; i >= 0; i--) { const dk = keyOf(fOff - i); days.push({ k: dk, t: totals(dayItems(dk)).kcal }); }
  const mx = Math.max(g.kcal * 1.3, ...days.map(d => d.t));
  const rec = days.filter(d => d.t > 0);
  $('#fWeek').innerHTML = `<h3>📊 1週間 <small class="muted" style="font-size:12px">${rec.length ? `平均 ${r0(avg(rec.map(d => d.t))).toLocaleString()} kcal` : ''}</small></h3>
    <div class="wbars"><div class="gl" style="bottom:${g.kcal / mx * 100 * 0.82 + 14}px"></div>` + days.map(d => {
      const [, mo, dd] = d.k.split('-').map(Number);
      return `<div class="col${d.k === k ? ' today' : ''}"><i class="${d.t > g.kcal ? 'over' : ''}" style="height:${d.t / mx * 82}%"></i>${mo}/${dd}</div>`;
    }).join('') + '</div><p class="muted" style="font-size:11px;margin-top:6px">緑の点線が目標。数字は「だいたい」のめやすだよ</p>';
}

// 追加シート
let addMeal = 'b', addedFlash = {};
function openAdd(m) {
  addMeal = m || mealNow();
  $('#fq').value = ''; $('#cformWrap').hidden = true;
  renderAdd(); $('#addSheet').hidden = false;
}
function optHtml(x, i) {
  return `<button class="fopt${addedFlash[x.name] ? ' added' : ''}" data-pick="${i}"><span class="e">${esc(x.emoji || '🍽')}</span><span class="n">${esc(x.name)}<small>${esc(x.unit || '')}${x.p != null ? ` ・ P${r1(x.p)} F${r1(x.f)} C${r1(x.c)}` : ''}</small></span><span class="k">${addedFlash[x.name] ? '✓ 追加' : r0(x.kcal) + ' kcal'}</span><span class="fav" data-fav="${esc(x.name)}" aria-label="よく食べるに固定">${favs().includes(x.name) ? '★' : '☆'}</span></button>`;
}
let shown = [];
function renderAdd() {
  $('#addTitle').textContent = (fOff === 0 ? '' : dateLabel(fDayKey()) + 'の') + 'ごはんを追加';
  $('#addMeals').innerHTML = MEALS.map(([m, e, l]) => `<button data-am="${m}" class="${m === addMeal ? 'on' : ''}">${e} ${l.replace('ごはん', '')}</button>`).join('');
  const q = $('#fq').value.trim();
  if (q) {
    shown = searchFoods(q);
    $('#fres').innerHTML = shown.length ? shown.map(optHtml).join('') : '<p class="muted">見つからなかったよ。下の「自分で入力」から追加してね</p>';
  } else {
    const fr = frequent(), names = new Set(fr.map(x => x.name));
    shown = fr.concat(FOOD_DB.filter(x => !names.has(x.name)).slice(0, 30));
    $('#fres').innerHTML = (fr.length ? '<h5>⭐ よく食べる</h5>' + fr.map(optHtml).join('') : '') + '<h5>📖 いろいろ</h5>' + shown.slice(fr.length).map((x, i) => optHtml(x, i + fr.length)).join('');
  }
}
$('#fq').addEventListener('input', renderAdd);
$('#addMeals').addEventListener('click', e => { const b = e.target.closest('[data-am]'); if (b) { addMeal = b.dataset.am; renderAdd(); } });
$('#fres').addEventListener('click', e => {
  const fv = e.target.closest('[data-fav]');
  if (fv) { toggleFav(fv.dataset.fav); renderAdd(); return; }
  const b = e.target.closest('[data-pick]'); if (!b) return;
  const x = shown[+b.dataset.pick]; if (!x) return;
  addFood(fDayKey(), addMeal, x, 1);
  addedFlash[x.name] = true; setTimeout(() => { delete addedFlash[x.name]; if (!$('#addSheet').hidden) renderAdd(); }, 1500);
  try { navigator.vibrate && navigator.vibrate(15); } catch (er) {}
  renderAdd(); renderFood();
});
$('#customBtn').addEventListener('click', () => { $('#cformWrap').hidden = !$('#cformWrap').hidden; if (!$('#cformWrap').hidden) $('#cName').focus(); });
$('#cSave').addEventListener('click', () => {
  const name = $('#cName').value.trim(), kcal = parseFloat($('#cKcal').value);
  if (!name || isNaN(kcal)) { toast('名前とカロリーを入れてね'); return; }
  const num = id => { const v = parseFloat($(id).value); return isNaN(v) ? 0 : v; };
  const it = { emoji: '🍽', name, unit: $('#cUnit').value.trim(), kcal, p: num('#cP'), f: num('#cF'), c: num('#cC'), alias: '' };
  const cs = load(F_CUSTOM, []).filter(x => x.name !== name); cs.unshift(it); store(F_CUSTOM, cs);
  addFood(fDayKey(), addMeal, it, 1);
  ['#cName', '#cKcal', '#cUnit', '#cP', '#cF', '#cC'].forEach(id => { $(id).value = ''; });
  $('#cformWrap').hidden = true; toast(`「${name}」を追加したよ（次からは検索で出るよ）`); renderAdd(); renderFood();
});
$('#addDone').addEventListener('click', () => { $('#addSheet').hidden = true; });

// ---------- 📸 写真から推測（Supabase の food-photo にお願いする）----------
const SB_URL = 'https://tzbqsudphypzvjbuoyrz.supabase.co', SB_KEY = 'sb_publishable_Ue1rb78TVjAOhf59ssBylg_SDywtSps';
async function sbToken() {
  const a = load('sync:auth', null);
  if (!a) return null;
  if (Date.now() < a.expires_at - 60000) return a.access_token;
  try {
    const r = await fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: a.refresh_token }) });
    if (!r.ok) return null;
    const d = await r.json();
    store('sync:auth', Object.assign({}, a, { access_token: d.access_token, refresh_token: d.refresh_token, expires_at: Date.now() + (d.expires_in || 3600) * 1000 }));
    return d.access_token;
  } catch (e) { return null; }
}
function shrink(file, max = 1024) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => rej(new Error('写真を読みこめなかったよ'));
    img.src = url;
  });
}
let pItems = [], pOn = [], pData = {};
$('#photoBtn').addEventListener('click', () => {
  if (!load('sync:auth', null)) { toast('写真の機能は、📋タスクの⚙️ →「☁️ 同期」でログインすると使えるよ'); return; }
  $('#photoIn').value = ''; $('#photoIn').click();
});
$('#photoIn').addEventListener('change', async () => {
  const file = $('#photoIn').files[0]; if (!file) return;
  let dataUrl;
  try { dataUrl = await shrink(file); } catch (e) { toast(e.message); return; }
  $('#pv').src = dataUrl;
  $('#pBody').innerHTML = '<div class="ploading">🔎 AIが写真を見てるよ<span class="dot">…</span><br><small>10〜30秒くらいかかるよ</small></div>';
  $('#photoSheet').hidden = false;
  try {
    const t = await sbToken();
    if (!t) throw new Error('ログインが切れたみたい。⚙️ →「☁️ 同期」でログインしてね');
    const r = await fetch(SB_URL + '/functions/v1/food-photo', {
      method: 'POST',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: dataUrl.split(',')[1], media_type: 'image/jpeg' })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || (r.status === 404 ? 'まだ写真の機能の準備ができていないよ（Supabaseの設定を確認してね）' : 'うまくいかなかったよ（' + r.status + '）'));
    pData = d; pItems = d.items || []; pOn = pItems.map(() => true);
    renderPhoto(d);
  } catch (e) {
    $('#pBody').innerHTML = `<p class="pcomment">⚠️ ${esc(e.message || e)}</p><button class="big" data-pclose="1">とじる</button>`;
  }
});
function renderPhoto(d) {
  if (!pItems.length) { $('#pBody').innerHTML = `<p class="pcomment">${esc(d.comment || '食べものが見つからなかったよ')}</p><button class="big" data-pclose="1">とじる</button>`; return; }
  const sum = pItems.reduce((a, x, i) => a + (pOn[i] ? x.kcal : 0), 0);
  const m = MEALS.find(x => x[0] === addMeal);
  $('#pBody').innerHTML = pItems.map((x, i) => `<button class="pitem${pOn[i] ? '' : ' off'}" data-pi="${i}"><span class="ck2">${pOn[i] ? '✓' : ''}</span><span class="e">${esc(x.emoji || '🍽')}</span>
      <span class="n">${esc(x.name)}<small>${esc(x.amount || '')} ・ P${r1(x.p)} F${r1(x.f)} C${r1(x.c)}</small></span><span class="k">${r0(x.kcal)} kcal</span></button>`).join('')
    + (d.comment ? `<p class="pcomment">💬 ${esc(d.comment)}</p>` : '')
    + `<p class="muted" style="font-size:12px">${d.confidence === 'low' ? '⚠️ 写真から分かりにくかったので、数字はかなりざっくりだよ。' : ''}追加したあと、タップで量（半分・2倍など）を直せるよ</p>`
    + `<button class="big" id="pAdd" style="margin-top:10px">${m[1]} ${m[2]}に追加（${r0(sum)} kcal）</button><button class="danger" data-pclose="1">追加しない</button>`;
}
$('#pBody').addEventListener('click', e => {
  const it = e.target.closest('[data-pi]');
  if (it) { const i = +it.dataset.pi; pOn[i] = !pOn[i]; renderPhoto(pData); return; }
  if (e.target.closest('#pAdd')) {
    let n = 0;
    pItems.forEach((x, i) => { if (pOn[i]) { addFood(fDayKey(), addMeal, { emoji: x.emoji, name: x.name, unit: x.amount, kcal: x.kcal, p: x.p, f: x.f, c: x.c }, 1); n++; } });
    $('#photoSheet').hidden = true; $('#addSheet').hidden = true;
    toast(n ? `📸 ${n}品追加したよ` : '何も追加しなかったよ'); renderFood(); return;
  }
  if (e.target.closest('[data-pclose]')) $('#photoSheet').hidden = true;
});

// 記録したごはんの編集
let curItem = null;
function openItem(id) {
  const x = dayItems(fDayKey()).find(i => i.id === id); if (!x) return;
  curItem = x;
  $('#itemTitle').textContent = `${x.emoji} ${x.name}`;
  $('#itemInfo').textContent = `${x.unit ? x.unit + 'あたり ' : ''}${r0(x.kcal)} kcal ・ P${r1(x.p)} F${r1(x.f)} C${r1(x.c)}`;
  renderItem(); $('#itemSheet').hidden = false;
}
function renderItem() {
  const x = curItem;
  $('#itemQty').innerHTML = QTYS.map(([q, l]) => `<button data-q="${q}" class="${x.qty === q ? 'on' : ''}">${l}</button>`).join('') + `<span style="width:100%;text-align:center;font-weight:900;margin-top:6px">${r0(x.kcal * x.qty)} kcal</span>`;
  $('#itemMeals').innerHTML = MEALS.map(([m, e, l]) => `<button data-im="${m}" class="${m === x.meal ? 'on' : ''}">${e} ${l.replace('ごはん', '')}</button>`).join('');
}
$('#itemQty').addEventListener('click', e => { const b = e.target.closest('[data-q]'); if (!b) return; curItem.qty = +b.dataset.q; updateItem(fDayKey(), curItem.id, { qty: curItem.qty }); renderItem(); renderFood(); });
$('#itemMeals').addEventListener('click', e => { const b = e.target.closest('[data-im]'); if (!b) return; curItem.meal = b.dataset.im; updateItem(fDayKey(), curItem.id, { meal: curItem.meal }); renderItem(); renderFood(); });
$('#itemClose').addEventListener('click', () => { $('#itemSheet').hidden = true; });
$('#itemDel').addEventListener('click', () => { removeItem(fDayKey(), curItem.id); $('#itemSheet').hidden = true; toast('削除したよ'); renderFood(); });

// 目標
let fsPreset = 'bal';
$('#fsPresets').addEventListener('click', e => { const b = e.target.closest('[data-pr]'); if (b) { fsPreset = b.dataset.pr; renderPresets(); } });
function renderPresets() { $('#fsPresets').innerHTML = PRESETS.map(([k, l, p, f, c]) => `<button data-pr="${k}" class="${k === fsPreset ? 'on' : ''}">${l}<br><small>P${p}% F${f}% C${c}%</small></button>`).join(''); }
$('#fsSave').addEventListener('click', () => {
  const k = parseInt($('#fsKcal').value, 10);
  store(F_SET, { kcal: isNaN(k) || k < 800 ? 1800 : k, preset: fsPreset });
  $('#fSetSheet').hidden = true; renderFood(); toast('目標を変えたよ');
});

document.body.addEventListener('click', e => {
  const ad = e.target.closest('[data-add]'); if (ad) openAdd(ad.dataset.add);
  const it = e.target.closest('[data-item]'); if (it) openItem(it.dataset.item);
  const cp = e.target.closest('[data-copy]');
  if (cp) {
    const m = cp.dataset.copy;
    dayItems(keyOf(fOff - 1)).filter(x => x.meal === m).forEach(x => addFood(fDayKey(), m, x, x.qty));
    toast('コピーしたよ'); renderFood();
  }
  const fd = e.target.closest('[data-fday]');
  if (fd) { fOff = Math.min(0, fOff + +fd.dataset.fday); renderFood(); }
  if (e.target.closest('[data-act="fset"]')) { const s = fSet(); $('#fsKcal').value = s.kcal; fsPreset = s.preset; renderPresets(); $('#fSetSheet').hidden = false; }
  const v = e.target.closest('[data-view]');
  if (v) setView(v.dataset.view);
});
function setView(v) {
  store('body:view', v);
  document.querySelectorAll('#views button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  $('#viewFood').hidden = v !== 'food'; $('#viewBody').hidden = v !== 'body';
  if (v === 'food') renderFood(); else render();
  window.scrollTo(0, 0);
}

function render() {
  const d = new Date();
  $('#date').textContent = `${d.getMonth() + 1}月${d.getDate()}日（${WD[d.getDay()]}）`;
  renderHero(); renderGoal(); renderChart(); renderTiles(); renderPeriod(); renderSummary(); renderInsight(); renderHist();
}
onDataChange(() => { if (document.activeElement && ['wIn', 'fq'].includes(document.activeElement.id)) return; render(); if (!$('#viewFood').hidden) renderFood(); });
render();
if (load('body:view', 'body') === 'food' || location.hash === '#food') setView('food');
