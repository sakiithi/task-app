<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf8fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17141b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="タスク">
<title>タスクタイムライン</title>
<style>
  :root {
    --bg: #faf8fb;
    --surface: #ffffff;
    --text: #2a2433;
    --muted: #8a8294;
    --line: #ebe5ef;
    --accent: #b5487f;
    --accent-2: #7d62c9;
    --accent-soft: #f6ecf3;
    --done: #4f9d84;
    --warn: #d0435f;
    --shadow: 0 1px 2px rgba(42, 36, 51, .04), 0 6px 20px rgba(42, 36, 51, .06);
    --grad: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17141b;
      --surface: #221e27;
      --text: #f1ecf4;
      --muted: #a39bab;
      --line: #332d3a;
      --accent: #e07bb0;
      --accent-2: #a68cf0;
      --accent-soft: #2e2333;
      --done: #74c4a8;
      --warn: #ef7189;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .3);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden;
    padding-top: env(safe-area-inset-top);
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }

  header { padding: 18px 20px 10px; display: flex; align-items: flex-end; justify-content: space-between; }
  .today { font-size: 13px; color: var(--muted); letter-spacing: .04em; }
  h1 { font-size: 22px; font-weight: 600; margin: 2px 0 0; letter-spacing: .02em; }
  .count { font-size: 13px; color: var(--muted); padding-bottom: 3px; }
  .count b { color: var(--accent); font-weight: 600; }

  .controls { display: flex; gap: 8px; padding: 0 20px 4px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    border-radius: 999px; padding: 8px 14px; font-size: 13px;
  }
  .chip.primary { border-color: transparent; background: var(--grad); color: #fff; font-weight: 600; }
  .chip[aria-pressed="true"]:not(.primary) { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  /* タイムライン */
  .stage {
    position: relative; flex: 1; overflow: hidden;
    touch-action: pan-y; user-select: none; -webkit-user-select: none;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
  }
  .axis { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
  .track { position: absolute; top: 0; bottom: 0; left: 0; display: flex; will-change: transform; }
  .slot { position: relative; width: 184px; flex: none; height: 100%; }
  .dot {
    position: absolute; left: 50%; top: 50%; width: 9px; height: 9px;
    margin: -4.5px 0 0 -4.5px; border-radius: 50%;
    background: var(--surface); border: 2px solid var(--accent);
  }
  .slot.today .dot { background: var(--accent); }
  .slot.overdue .dot { border-color: var(--warn); background: var(--warn); }
  .slot.done .dot { border-color: var(--done); background: var(--done); }
  .stem { position: absolute; left: 50%; width: 1px; height: 22px; background: var(--line); }
  .slot.up .stem { bottom: 50%; margin-bottom: 5px; }
  .slot.down .stem { top: 50%; margin-top: 5px; }
  .card {
    position: absolute; left: 8px; right: 8px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow);
    font-size: 15px; line-height: 1.45; word-break: break-word; cursor: pointer;
  }
  .slot.up .card { bottom: calc(50% + 27px); }
  .slot.down .card { top: calc(50% + 27px); }
  .title { font-weight: 500; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .meta .when.today { color: var(--accent); font-weight: 600; }
  .meta .when.overdue { color: var(--warn); font-weight: 600; }
  .meta .rep { color: var(--accent-2); }
  .slot.done .title { text-decoration: line-through; color: var(--muted); }

  .empty {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--muted); font-size: 14px; text-align: center; padding: 24px; line-height: 2;
  }
  .empty b { color: var(--text); font-weight: 600; }

  /* 今やる1つ */
  .focus {
    position: absolute; inset: 0; z-index: 2; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; gap: 16px;
  }
  .focus[hidden] { display: none; }
  .focus-label { font-size: 12px; letter-spacing: .24em; color: var(--muted); }
  #focusBody { width: min(340px, 100%); display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .focus-card {
    width: 100%; min-height: 150px; padding: 26px 22px; border-radius: 22px; text-align: center;
    background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; gap: 10px;
    touch-action: none; cursor: grab;
  }
  .focus-card::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--grad); }
  .focus-card.enter { animation: enter .4s cubic-bezier(.2, .8, .3, 1.15); }
  @keyframes enter { from { transform: translateX(40vw) scale(.92); opacity: 0; } }
  .focus-title { font-size: 21px; font-weight: 600; line-height: 1.45; word-break: break-word; }
  .focus-card .meta { justify-content: center; font-size: 13px; margin: 0; }
  .focus-hint { font-size: 12px; color: var(--muted); text-align: center; }
  .focus-btns { display: flex; gap: 10px; }
  .btn {
    padding: 12px 22px; font-size: 15px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
  }
  .btn.go { border-color: transparent; background: var(--grad); color: #fff; font-weight: 600; }
  .focus-clear { font-size: 18px; text-align: center; line-height: 1.9; }

  .timer { width: min(340px, 100%); display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .timer-row { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .timer-row .chip { padding: 6px 12px; }
  .timer-left { font-size: 28px; font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  .bar { width: 100%; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--grad); width: 0; transition: width 1s linear; }

  /* 入力欄 */
  .composer {
    padding: 8px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--surface); border-top: 1px solid var(--line);
  }
  .preview { min-height: 22px; font-size: 13px; color: var(--accent); padding: 0 4px 6px; }
  form { display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0; font-size: 16px; padding: 12px 14px;
    border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  input::placeholder { color: var(--muted); }
  input:focus { outline: none; border-color: var(--accent); }
  .mic {
    width: 46px; flex: none; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--accent); display: grid; place-items: center;
  }
  .mic svg { width: 21px; height: 21px; }
  .mic.listening { background: var(--grad); color: #fff; border-color: transparent; animation: listen 1.2s ease-in-out infinite; }
  @keyframes listen { 50% { box-shadow: 0 0 0 7px var(--accent-soft); } }
  button.add { border: 0; border-radius: 12px; padding: 0 18px; font-size: 15px; font-weight: 600; background: var(--grad); color: #fff; }

  /* お知らせ */
  .toast {
    position: fixed; left: 16px; right: 16px; z-index: 20;
    bottom: calc(118px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 12px; justify-content: space-between;
    padding: 12px 16px; border-radius: 14px;
    background: var(--text); color: var(--bg);
    font-size: 14px; transform: translateY(12px); opacity: 0; pointer-events: none;
    transition: transform .2s, opacity .2s;
  }
  .toast.show { transform: none; opacity: 1; pointer-events: auto; }
  .toast button { flex: none; border: 0; background: none; color: var(--accent); font-size: 14px; font-weight: 700; padding: 4px; }
  @media (prefers-color-scheme: dark) { .toast button { color: var(--accent); filter: brightness(.8); } }

  /* シート */
  .sheet-bg {
    position: fixed; inset: 0; z-index: 10; background: rgba(20, 14, 26, .35);
    display: none; align-items: flex-end;
  }
  .sheet-bg.open { display: flex; }
  .sheet {
    width: 100%; background: var(--surface); border-radius: 20px 20px 0 0;
    padding: 20px 16px calc(18px + env(safe-area-inset-bottom));
    max-height: 85vh; overflow-y: auto;
  }
  .sheet h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  .sheet p { margin: 0 0 4px; font-size: 17px; font-weight: 500; word-break: break-word; }
  .sheet .hint { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .row {
    display: block; width: 100%; padding: 14px; margin-top: 8px; font-size: 15px; text-align: left;
    border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  .row small { float: right; color: var(--muted); font-size: 13px; }
  .row.center { text-align: center; }
  .danger { color: var(--warn); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .grid button {
    padding: 12px 0; font-size: 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  .grid button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .custom { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .custom input { flex: 1; }
  .custom span { color: var(--muted); }
</style>
</head>
<body>
  <header>
    <div>
      <div class="today" id="today"></div>
      <h1>タスクタイムライン</h1>
    </div>
    <span class="count" id="count"></span>
  </header>
  <div class="controls">
    <button class="chip primary" id="focusBtn" aria-pressed="false">今やる1つ</button>
    <button class="chip" id="pause" aria-pressed="false">一時停止</button>
    <button class="chip" id="speedBtn"></button>
  </div>

  <div class="stage" id="stage">
    <div class="axis"></div>
    <div class="track" id="track"></div>
    <div class="empty" id="empty">
      <div>マイクを押して話すだけで追加できます<br>
      <b>「明日15時に歯医者」</b><br><b>「毎朝7時に薬」</b><br><b>「金曜までにレポート」</b></div>
    </div>
    <div class="focus" id="focus" hidden>
      <div class="focus-label">今やること</div>
      <div id="focusBody"></div>
      <div class="timer" id="timer"></div>
    </div>
  </div>

  <div class="composer">
    <div class="preview" id="preview"></div>
    <form id="form" autocomplete="off">
      <button class="mic" id="mic" type="button" aria-label="話して追加">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11.5" rx="3"/><path d="M5.5 10.5a6.5 6.5 0 0 0 13 0M12 17v4"/></svg>
      </button>
      <input id="input" placeholder="例：毎週月曜9時に会議" maxlength="80" enterkeyhint="done">
      <button class="add" type="submit">追加</button>
    </form>
  </div>

  <div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo" type="button">取り消す</button></div>

  <!-- タスク操作 -->
  <div class="sheet-bg" id="taskSheet">
    <div class="sheet">
      <p id="sheetTitle"></p>
      <div class="hint" id="sheetDue"></div>
      <button class="row center" id="toggleDone">完了にする</button>
      <button class="row center" id="sheetSnooze">延期する</button>
      <button class="row center danger" id="remove">削除</button>
      <button class="row center" data-close>閉じる</button>
    </div>
  </div>

  <!-- 延期 -->
  <div class="sheet-bg" id="snoozeSheet">
    <div class="sheet">
      <h2>いつにする？</h2>
      <div class="hint" id="snoozeHint"></div>
      <div id="snoozeList"></div>
      <button class="row center" data-close>閉じる</button>
    </div>
  </div>

  <!-- 流れる速さ -->
  <div class="sheet-bg" id="speedSheet">
    <div class="sheet">
      <h2>流れる速さ</h2>
      <div class="hint">1つのタスクが、画面の右端から左端まで流れる時間です</div>
      <div class="grid" id="speedGrid"></div>
      <div class="custom">
        <input id="speedInput" type="number" inputmode="decimal" min="0.1" max="120" step="0.1" placeholder="好きな時間">
        <span>分</span>
        <button class="add" id="speedSet" type="button" style="padding:12px 16px">決定</button>
      </div>
      <button class="row center" data-close>閉じる</button>
    </div>
  </div>

<script>
const KEY = 'task-app:tasks';
const SPEED_KEY = 'task-app:crossMinutes';
const SLOT_W = 184;
const SPEED_CHOICES = [1 / 6, 0.5, 1, 2, 3, 5, 10, 30];
const WD = '日月火水木金土';
const DAY = 86400e3;

function read(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch { return fallback; }
}
function write(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

let tasks = read(KEY, []);
let crossMinutes = read(SPEED_KEY, 1);
let offset = 0, paused = false, dragging = false, lastX = 0, moved = 0;
let selectedId = null;
let view = [], slots = [];
let focusMode = false, skipped = new Set(), current = null;

const $ = id => document.getElementById(id);
const track = $('track'), stage = $('stage');
const save = () => write(KEY, tasks);
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const withTime = (d, h, mi) => new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, mi);

/* ───────── 繰り返し ───────── */
function occurs(rep, d) {
  const dow = d.getDay();
  if (rep.type === 'daily') return true;
  if (rep.type === 'weekdays') return dow >= 1 && dow <= 5;
  if (rep.type === 'weekly') return rep.days.includes(dow);
  if (rep.type === 'monthly') {
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    return d.getDate() === Math.min(rep.day, last);
  }
  return false;
}
// from の日（含む）以降で、最初に当てはまる日時
function firstOccurrence(rep, from, h, mi, allDay) {
  const now = new Date();
  for (let i = 0; i < 400; i++) {
    const day = addDays(startOfDay(from), i);
    if (!occurs(rep, day)) continue;
    const at = allDay ? day : withTime(day, h, mi);
    if (allDay ? day >= startOfDay(now) : at > now) return at;
  }
  return null;
}
function nextDue(t) {
  const d = new Date(t.due);
  return firstOccurrence(t.repeat, addDays(startOfDay(d), 1), d.getHours(), d.getMinutes(), t.allDay)?.getTime() ?? null;
}
function repeatLabel(rep) {
  if (!rep) return '';
  if (rep.type === 'daily') return '毎日';
  if (rep.type === 'weekdays') return '平日';
  if (rep.type === 'weekly') return `毎週${rep.days.map(i => WD[i]).join('・')}`;
  if (rep.type === 'monthly') return `毎月${rep.day}日`;
  return '';
}

/* ───────── 日本語の日時を読み取る ───────── */
function parseJa(raw) {
  let text = raw.replace(/[０-９：／]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  const now = new Date();
  const today = startOfDay(now);
  let date = null, h = null, mi = 0, m, repeat = null, night = false;
  const take = re => { const r = text.match(re); if (r) text = text.replace(r[0], ' '); return r; };

  // 繰り返し
  if (take(/平日/)) repeat = { type: 'weekdays' };
  else if ((m = take(/毎月\s*(\d{1,2})\s*日/))) repeat = { type: 'monthly', day: +m[1] };
  else if ((m = take(/毎週\s*([日月火水木金土・、と曜]+)/))) {
    const days = [...new Set([...m[1].replace(/曜日?/g, '')].filter(c => WD.includes(c)).map(c => WD.indexOf(c)))].sort();
    repeat = { type: 'weekly', days: days.length ? days : [today.getDay()] };
  } else if ((m = take(/毎\s*([日月火水木金土])曜日?/))) repeat = { type: 'weekly', days: [WD.indexOf(m[1])] };
  else if ((m = take(/毎(日|朝|晩|夜)/))) { repeat = { type: 'daily' }; night = m[1] === '晩' || m[1] === '夜'; }
  else if (take(/毎週/)) repeat = { type: 'weekly', days: [today.getDay()] };
  else if (take(/毎月/)) repeat = { type: 'monthly', day: today.getDate() };

  // ○時間後・○分後
  if (!repeat && ((m = take(/(\d+)\s*時間後/)) || (m = take(/(\d+)\s*分後/)))) {
    const ms = m[0].includes('時間') ? +m[1] * 3600e3 : +m[1] * 60e3;
    return finish(text, raw, new Date(now.getTime() + ms), false, null);
  }

  // 日付
  if (!repeat) {
    if ((m = take(/(\d+)\s*日後/))) date = addDays(today, +m[1]);
    else if (take(/明後日|あさって/)) date = addDays(today, 2);
    else if (take(/明日|あした/)) date = addDays(today, 1);
    else if (take(/今日|きょう/)) date = today;
    else if ((m = take(/(\d{1,2})\s*月\s*(\d{1,2})\s*日/)) || (m = take(/(\d{1,2})\/(\d{1,2})/))) {
      date = new Date(today.getFullYear(), +m[1] - 1, +m[2]);
      if (date < today) date.setFullYear(date.getFullYear() + 1);
    } else if ((m = take(/(今週|来週|再来週)?\s*の?\s*([日月火水木金土])曜日?/))) {
      const target = WD.indexOf(m[2]);
      const dow = today.getDay();
      if (m[1]) {
        const monday = addDays(today, -((dow + 6) % 7));
        date = addDays(monday, (target + 6) % 7 + { 今週: 0, 来週: 1, 再来週: 2 }[m[1]] * 7);
      } else {
        date = addDays(today, (target - dow + 7) % 7);
      }
    } else if ((m = take(/(\d{1,2})\s*日/))) {
      date = new Date(today.getFullYear(), today.getMonth(), +m[1]);
      if (date < today) date.setMonth(date.getMonth() + 1);
    }
  }

  // 時刻
  let ampm = null;
  if ((m = take(/(午前|午後|朝|夜|夕方|夜中)?\s*(\d{1,2})\s*時\s*(半|(\d{1,2})\s*分)?/))) {
    ampm = m[1]; h = +m[2]; mi = m[3] === '半' ? 30 : (m[4] ? +m[4] : 0);
  } else if ((m = take(/(午前|午後|朝|夜|夕方)?\s*(\d{1,2}):(\d{2})/))) {
    ampm = m[1]; h = +m[2]; mi = +m[3];
  }
  if (h !== null) {
    if (!ampm && night) ampm = '夜';
    if (['午後', '夜', '夕方'].includes(ampm) && h < 12) h += 12;
    if (ampm === '午前' && h === 12) h = 0;
    if (h > 23 || mi > 59) h = null;
  }

  if (repeat) {
    const allDay = h === null;
    const first = firstOccurrence(repeat, today, h ?? 0, mi, allDay);
    return finish(text, raw, first, allDay, repeat);
  }
  if (date && h !== null) return finish(text, raw, withTime(date, h, mi), false, null);
  if (date) return finish(text, raw, date, true, null);
  if (h !== null) {
    let d = withTime(today, h, mi);
    if (d < now) d = withTime(addDays(today, 1), h, mi);
    return finish(text, raw, d, false, null);
  }
  return { title: raw.trim(), due: null, allDay: false, repeat: null };
}
function finish(text, raw, d, allDay, repeat) {
  const title = text
    .replace(/(^|\s)(までには|までに|まで|には|に|から|の|は|で|、|,)+/g, '$1')
    .replace(/[\s。、]+/g, ' ').trim();
  return { title: title || raw.trim(), due: d ? d.getTime() : null, allDay, repeat };
}

/* ───────── 表示用 ───────── */
function dueLabel(t) {
  if (!t.due) return '';
  const d = new Date(t.due);
  const diff = Math.round((startOfDay(d) - startOfDay(new Date())) / DAY);
  const day = diff === 0 ? '今日' : diff === 1 ? '明日' : diff === 2 ? 'あさって' : diff === -1 ? '昨日'
    : `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`;
  return t.allDay ? day : `${day} ${d.getHours()}:${pad(d.getMinutes())}`;
}
function isOverdue(t) {
  if (!t.due || t.done) return false;
  return t.allDay ? startOfDay(new Date(t.due)) < startOfDay(new Date()) : t.due < Date.now();
}
const isToday = t => t.due && !t.done && startOfDay(new Date(t.due)).getTime() === startOfDay(new Date()).getTime();
// 終日は「その日の終わり」として比べる
const dueKey = t => !t.due ? Infinity : t.allDay ? t.due + DAY - 1 : t.due;
const byPriority = (a, b) => (a.done - b.done) || dueKey(a) - dueKey(b) || a.created - b.created;

function metaHtml(t) {
  const parts = [];
  if (t.due) {
    const cls = isOverdue(t) ? 'overdue' : isToday(t) ? 'today' : '';
    parts.push(`<span class="when ${cls}">${isOverdue(t) ? '期限切れ · ' : ''}${dueLabel(t)}</span>`);
  }
  if (t.repeat) parts.push(`<span class="rep">↻ ${repeatLabel(t.repeat)}</span>`);
  return parts.length ? `<div class="meta">${parts.join('')}</div>` : '';
}

/* ───────── タイムライン ───────── */
const setWidth = () => tasks.length * SLOT_W;

function render() {
  const now = new Date();
  $('today').textContent = `${now.getMonth() + 1}月${now.getDate()}日 (${WD[now.getDay()]})`;
  view = [...tasks].sort(byPriority);
  const left = tasks.filter(t => !t.done).length;
  const todayN = tasks.filter(t => isToday(t) || isOverdue(t)).length;
  $('count').innerHTML = tasks.length ? `今日 <b>${todayN}</b> ・ 残り ${left}` : '';
  $('empty').style.display = tasks.length || focusMode ? 'none' : 'grid';

  track.innerHTML = '';
  slots = [];
  if (!tasks.length) return;
  const repeat = Math.ceil(stage.clientWidth / setWidth()) + 1;
  const frag = document.createDocumentFragment();
  for (let r = 0; r < repeat; r++) {
    view.forEach((t, i) => {
      const slot = document.createElement('div');
      const state = t.done ? ' done' : isOverdue(t) ? ' overdue' : isToday(t) ? ' today' : '';
      slot.className = `slot ${i % 2 ? 'down' : 'up'}${state}`;
      slot.innerHTML = `<div class="stem"></div><div class="dot"></div>
        <div class="card" data-id="${t.id}"><div class="title"></div>${metaHtml(t)}</div>`;
      slot.querySelector('.title').textContent = t.title;
      frag.appendChild(slot);
    });
  }
  track.appendChild(frag);
  const w = setWidth();
  offset = ((offset % w) + w) % w;
}

let prev = performance.now();
function tick(now) {
  const dt = Math.min(now - prev, 100) / 1000;
  prev = now;
  if (tasks.length) {
    const w = setWidth();
    // 画面の幅を crossMinutes 分で横切る速さ
    if (!paused && !dragging && !focusMode) offset += stage.clientWidth / (crossMinutes * 60) * dt;
    offset = ((offset % w) + w) % w;
    track.style.transform = `translateX(${-offset}px)`;
  }
  requestAnimationFrame(tick);
}

stage.addEventListener('pointerdown', e => {
  if (focusMode) return;
  dragging = true; lastX = e.clientX; moved = 0;
});
window.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  lastX = e.clientX; moved += Math.abs(dx);
  offset -= dx;
});
window.addEventListener('pointerup', e => {
  if (!dragging) return;
  dragging = false;
  if (moved < 8) {
    const card = e.target.closest && e.target.closest('.card');
    if (card) openTask(card.dataset.id);
  }
});
window.addEventListener('pointercancel', () => { dragging = false; });

/* ───────── お知らせ（取り消し付き） ───────── */
let toastTimer, undoFn = null;
function toast(msg, undo) {
  $('toastMsg').textContent = msg;
  undoFn = undo || null;
  $('toastUndo').style.display = undo ? '' : 'none';
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 4500);
}
$('toastUndo').onclick = () => {
  if (undoFn) undoFn();
  undoFn = null;
  $('toast').classList.remove('show');
};
const refresh = () => { save(); render(); if (focusMode) showFocus(false); };

/* ───────── 追加 ───────── */
function addTask(raw) {
  const p = parseJa(raw);
  if (!p.title) return;
  const t = { id: newId(), title: p.title, due: p.due, allDay: p.allDay, repeat: p.repeat, created: Date.now(), done: false };
  tasks.push(t);
  refresh();
  const extra = [dueLabel(t), repeatLabel(t.repeat) && `↻${repeatLabel(t.repeat)}`].filter(Boolean).join(' ');
  toast(`追加：${t.title}${extra ? `（${extra}）` : ''}`, () => {
    tasks = tasks.filter(x => x.id !== t.id);
    refresh();
  });
}
function updatePreview() {
  const v = $('input').value.trim();
  if (!v) { $('preview').textContent = ''; return; }
  const p = parseJa(v);
  const extra = [dueLabel(p), p.repeat && `↻ ${repeatLabel(p.repeat)}`].filter(Boolean).join('　');
  $('preview').textContent = extra ? `${extra}　「${p.title}」` : '';
}
$('input').addEventListener('input', updatePreview);
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('input').value.trim();
  if (!v) return;
  addTask(v);
  $('input').value = '';
  updatePreview();
});

/* ───────── 完了（繰り返しは次の回へ） ───────── */
function complete(t) {
  if (t.repeat && t.due) {
    const prevDue = t.due;
    t.due = nextDue(t);
    refresh();
    toast(`完了！次は ${dueLabel(t)}`, () => { t.due = prevDue; refresh(); });
  } else {
    t.done = true;
    refresh();
    toast(`完了：${t.title}`, () => { t.done = false; refresh(); });
  }
}

/* ───────── 話して追加 ───────── */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
$('mic').onclick = () => {
  if (rec) { rec.stop(); return; }
  if (!SR) {
    toast('このブラウザは音声入力に未対応です。キーボードのマイクを使ってください');
    $('input').focus();
    return;
  }
  rec = new SR();
  rec.lang = 'ja-JP';
  rec.interimResults = true;
  rec.continuous = false;
  let finalText = '';
  rec.onstart = () => { $('mic').classList.add('listening'); $('preview').textContent = '聞いています…'; };
  rec.onresult = e => {
    const text = Array.from(e.results).map(r => r[0].transcript).join('');
    $('input').value = text;
    updatePreview();
    if (e.results[e.results.length - 1].isFinal) finalText = text;
  };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast('マイクが許可されていません。ブラウザの設定で許可してください');
    else if (e.error !== 'no-speech' && e.error !== 'aborted') toast('うまく聞き取れませんでした。もう一度どうぞ');
  };
  rec.onend = () => {
    $('mic').classList.remove('listening');
    rec = null;
    const v = (finalText || $('input').value).trim();
    if (v) { addTask(v); $('input').value = ''; }
    updatePreview();
  };
  try { rec.start(); } catch { rec = null; toast('音声入力を開始できませんでした'); }
};

/* ───────── 延期 ───────── */
let snoozeTarget = null;
function snoozeOptions() {
  const now = new Date(), today = startOfDay(now);
  const dow = today.getDay();
  const opts = [
    ['30分後', new Date(now.getTime() + 30 * 60e3)],
    ['1時間後', new Date(now.getTime() + 60 * 60e3)],
    ['3時間後', new Date(now.getTime() + 3 * 3600e3)],
  ];
  if (now.getHours() < 19) opts.push(['今夜', withTime(today, 20, 0)]);
  opts.push(['明日の朝', withTime(addDays(today, 1), 9, 0)]);
  if (dow !== 5 && dow !== 6) opts.push(['週末', withTime(addDays(today, (6 - dow + 7) % 7), 10, 0)]);
  opts.push(['来週', withTime(addDays(today, (8 - dow) % 7 || 7), 9, 0)]);
  return opts;
}
function openSnooze(t) {
  snoozeTarget = t;
  $('snoozeHint').textContent = t.title;
  const list = $('snoozeList');
  list.innerHTML = '';
  for (const [label, d] of snoozeOptions()) {
    const b = document.createElement('button');
    b.className = 'row';
    b.innerHTML = `${label}<small>${dueLabel({ due: d.getTime(), allDay: false })}</small>`;
    b.onclick = () => snoozeTo(d.getTime(), false);
    list.appendChild(b);
  }
  if (focusMode) {
    const b = document.createElement('button');
    b.className = 'row';
    b.innerHTML = 'とりあえずスキップ<small>期限はそのまま</small>';
    b.onclick = () => { skipped.add(t.id); closeAll(); showFocus(true); };
    list.appendChild(b);
  }
  closeAll();
  open('snoozeSheet');
}
function snoozeTo(due, allDay) {
  const t = snoozeTarget;
  if (!t) return;
  const before = { due: t.due, allDay: t.allDay };
  t.due = due; t.allDay = allDay;
  closeAll();
  refresh();
  if (focusMode) showFocus(true);
  toast(`延期：${dueLabel(t)} に`, () => { Object.assign(t, before); refresh(); });
}

/* ───────── 今やる1つ ───────── */
function pickNext() {
  const candidates = tasks.filter(t => !t.done).sort(byPriority);
  if (!candidates.length) return null;
  let rest = candidates.filter(t => !skipped.has(t.id));
  if (!rest.length) { skipped.clear(); rest = candidates; }
  return rest[0];
}
function showFocus(animate) {
  current = pickNext();
  const body = $('focusBody');
  if (!current) {
    body.innerHTML = `<div class="focus-clear">${tasks.length ? '全部おわりました 🎉' : 'タスクを追加すると<br>ここに1つずつ出てきます'}</div>`;
    renderTimer();
    return;
  }
  body.innerHTML = `
    <div class="focus-card${animate ? ' enter' : ''}" id="focusCard">
      <div class="focus-title"></div>${metaHtml(current)}
    </div>
    <div class="focus-hint">右にスワイプで完了 ・ 左で延期</div>
    <div class="focus-btns">
      <button type="button" class="btn" id="fLater">延期</button>
      <button type="button" class="btn go" id="fDone">完了</button>
    </div>`;
  body.querySelector('.focus-title').textContent = current.title;
  $('fLater').onclick = () => openSnooze(current);
  $('fDone').onclick = () => fling(1);
  bindSwipe($('focusCard'));
  renderTimer();
}
function fling(dir) {
  const card = $('focusCard');
  if (!card || !current) return;
  if (dir < 0) {
    // 延期を選ぶ間、カードは元の位置へ
    card.style.transition = 'transform .25s';
    card.style.transform = '';
    return openSnooze(current);
  }
  const t = current;
  card.style.transition = 'transform .28s ease-in, opacity .28s';
  card.style.transform = 'translateX(110vw) rotate(12deg)';
  card.style.opacity = '0';
  stopTimer(false);
  setTimeout(() => { complete(t); showFocus(true); }, 260);
}
function bindSwipe(card) {
  let sx = null, dx = 0;
  card.addEventListener('pointerdown', e => {
    sx = e.clientX; dx = 0;
    card.setPointerCapture(e.pointerId);
    card.style.transition = 'none';
    card.style.animation = 'none';
  });
  card.addEventListener('pointermove', e => {
    if (sx === null) return;
    dx = e.clientX - sx;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
  });
  const end = () => {
    if (sx === null) return;
    sx = null;
    if (Math.abs(dx) > 80) return fling(Math.sign(dx));
    card.style.transition = 'transform .25s';
    card.style.transform = '';
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}
$('focusBtn').onclick = () => {
  focusMode = !focusMode;
  $('focusBtn').setAttribute('aria-pressed', focusMode);
  $('focusBtn').textContent = focusMode ? 'タイムラインに戻る' : '今やる1つ';
  $('focus').hidden = !focusMode;
  if (focusMode) { skipped.clear(); showFocus(true); }
  render();
};

/* ───────── 集中タイマー ───────── */
let timer = null; // { end, total }
let timerTick = null;
function renderTimer() {
  const box = $('timer');
  if (!current) { box.innerHTML = ''; return; }
  if (!timer) {
    box.innerHTML = `<div class="timer-row">集中タイマー
      <button class="chip" data-min="15">15分</button>
      <button class="chip" data-min="25">25分</button>
      <button class="chip" data-min="50">50分</button></div>`;
    box.querySelectorAll('[data-min]').forEach(b => b.onclick = () => startTimer(+b.dataset.min));
    return;
  }
  const left = Math.max(0, timer.end - Date.now());
  const s = Math.ceil(left / 1000);
  box.innerHTML = `<div class="timer-left">${Math.floor(s / 60)}:${pad(s % 60)}</div>
    <div class="bar"><i style="width:${100 - left / timer.total * 100}%"></i></div>
    <div class="timer-row"><button class="chip" id="timerStop">タイマーを止める</button></div>`;
  $('timerStop').onclick = () => stopTimer(false);
}
function startTimer(min) {
  timer = { end: Date.now() + min * 60e3, total: min * 60e3 };
  clearInterval(timerTick);
  timerTick = setInterval(() => {
    if (Date.now() >= timer.end) return stopTimer(true);
    if (focusMode) renderTimer();
  }, 1000);
  renderTimer();
}
function stopTimer(finished) {
  clearInterval(timerTick);
  timer = null;
  renderTimer();
  if (finished) {
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch {}
    chime();
    toast('時間です。おつかれさま！');
  }
}
function chime() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1175, 1568].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = f; o.type = 'sine';
      const t0 = ac.currentTime + i * .18;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(.18, t0 + .02);
      g.gain.exponentialRampToValueAtTime(.001, t0 + .6);
      o.connect(g).connect(ac.destination);
      o.start(t0); o.stop(t0 + .65);
    });
  } catch {}
}

/* ───────── シート共通・タスク操作 ───────── */
const open = id => $(id).classList.add('open');
const closeAll = () => document.querySelectorAll('.sheet-bg').forEach(s => s.classList.remove('open'));
document.querySelectorAll('[data-close]').forEach(b => b.onclick = closeAll);
document.querySelectorAll('.sheet-bg').forEach(bg => bg.addEventListener('click', e => { if (e.target === bg) closeAll(); }));

function openTask(id) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  selectedId = id;
  $('sheetTitle').textContent = t.title;
  $('sheetDue').textContent = [t.due ? dueLabel(t) : '期限なし', t.repeat && `↻ ${repeatLabel(t.repeat)}`].filter(Boolean).join('　');
  $('toggleDone').textContent = t.done ? '未完了に戻す' : t.repeat ? '完了して次の回へ' : '完了にする';
  open('taskSheet');
}
$('toggleDone').onclick = () => {
  const t = tasks.find(t => t.id === selectedId);
  closeAll();
  if (!t) return;
  if (t.done) { t.done = false; refresh(); } else complete(t);
};
$('sheetSnooze').onclick = () => {
  const t = tasks.find(t => t.id === selectedId);
  if (t) openSnooze(t);
};
$('remove').onclick = () => {
  const i = tasks.findIndex(t => t.id === selectedId);
  closeAll();
  if (i < 0) return;
  const [t] = tasks.splice(i, 1);
  refresh();
  toast(`削除：${t.title}`, () => { tasks.splice(i, 0, t); refresh(); });
};

/* ───────── 流れる速さ ───────── */
const speedLabel = m => m < 1 ? `${Math.round(m * 60)}秒` : `${+m.toFixed(1)}分`;
function setSpeed(m) {
  crossMinutes = m;
  write(SPEED_KEY, m);
  $('speedBtn').textContent = `1つ ${speedLabel(m)}`;
  document.querySelectorAll('#speedGrid button').forEach(b => b.classList.toggle('on', Math.abs(+b.dataset.m - m) < 1e-6));
}
SPEED_CHOICES.forEach(m => {
  const b = document.createElement('button');
  b.type = 'button'; b.dataset.m = m; b.textContent = speedLabel(m);
  b.onclick = () => { setSpeed(m); closeAll(); };
  $('speedGrid').appendChild(b);
});
$('speedBtn').onclick = () => { $('speedInput').value = ''; open('speedSheet'); };
$('speedSet').onclick = () => {
  const m = parseFloat($('speedInput').value);
  if (!(m >= 0.1 && m <= 120)) { $('speedInput').focus(); return; }
  setSpeed(Math.round(m * 10) / 10); closeAll();
};

$('pause').onclick = () => {
  paused = !paused;
  $('pause').setAttribute('aria-pressed', paused);
  $('pause').textContent = paused ? '再生' : '一時停止';
};

// 時間の経過で「今日・期限切れ」の表示を更新
setInterval(render, 60e3);
window.addEventListener('resize', render);
setSpeed(crossMinutes);
render();
requestAnimationFrame(tick);
</script>
</body>
</html>
