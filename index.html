<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1528" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="タスク">
<title>タスクタイムライン</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f1ff;
    --surface: #ffffff;
    --text: #4a3550;
    --muted: #a08ba6;
    --line: #eadff5;
    --accent: #ff6fa8;
    --accent-2: #a98bff;
    --accent-soft: #ffe6f0;
    --done: #3fbf93;
    --warn: #ff5d7a;
    --star: #ffb020;
    --shadow: 0 2px 4px rgba(150, 110, 200, .08), 0 10px 26px rgba(150, 110, 200, .16);
    --grad: linear-gradient(120deg, #ff7eb3 0%, #ff9ec4 40%, #b79bff 100%);
    --blob1: rgba(196, 168, 255, .55);
    --blob2: rgba(165, 135, 250, .45);
    --blob3: rgba(255, 180, 220, .38);

    /* カードのパステル5色：背景 / ふち / 文字 */
    --c0-bg: #ffe4ef; --c0-bd: #ffc6dc; --c0-ink: #d6457f;
    --c1-bg: #eee6ff; --c1-bd: #d8c9ff; --c1-ink: #7556d6;
    --c2-bg: #ffeadf; --c2-bd: #ffd1b8; --c2-ink: #d0663a;
    --c3-bg: #ddf6ec; --c3-bd: #b5e8d4; --c3-ink: #2d9471;
    --c4-bg: #fff3c9; --c4-bd: #ffe38c; --c4-ink: #b08300;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1528;
      --surface: #2a2136;
      --text: #fbeef6;
      --muted: #b9a2c0;
      --line: #3d3048;
      --accent: #ff8ab8;
      --accent-2: #bba4ff;
      --accent-soft: #3a2538;
      --done: #6fd9b0;
      --warn: #ff7d93;
      --star: #ffc94d;
      --shadow: 0 2px 4px rgba(0, 0, 0, .25), 0 10px 26px rgba(0, 0, 0, .35);
      --blob1: rgba(150, 110, 255, .26);
      --blob2: rgba(120, 90, 230, .24);
      --blob3: rgba(255, 110, 180, .14);

      --c0-bg: #432739; --c0-bd: #6a3a57; --c0-ink: #ffa3c8;
      --c1-bg: #352b4f; --c1-bd: #514174; --c1-ink: #c6b3ff;
      --c2-bg: #442e2a; --c2-bd: #6b443a; --c2-ink: #ffb894;
      --c3-bg: #23392f; --c3-bd: #335a49; --c3-ink: #8ee5c2;
      --c4-bg: #3d3622; --c4-bd: #63562f; --c4-ink: #ffdd7a;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    font-weight: 500;
    display: flex; flex-direction: column;
    overflow: hidden;
    padding-top: env(safe-area-inset-top);
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; font-weight: 700; cursor: pointer; }
  [hidden] { display: none !important; }

  /* ふんわり背景 */
  .bgfx { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .bgfx i { position: absolute; border-radius: 50%; filter: blur(50px); animation: float 18s ease-in-out infinite alternate; }
  .bgfx i:nth-child(1) { width: 60vmax; height: 60vmax; left: -20vmax; top: -18vmax; background: var(--blob1); }
  .bgfx i:nth-child(2) { width: 55vmax; height: 55vmax; right: -22vmax; top: 20vh; background: var(--blob2); animation-delay: -6s; }
  .bgfx i:nth-child(3) { width: 45vmax; height: 45vmax; left: 10vw; bottom: -25vmax; background: var(--blob3); animation-delay: -12s; }
  @keyframes float { to { transform: translate(4vmax, 3vmax) scale(1.08); } }

  header, .controls, .stage, .composer { position: relative; z-index: 1; }
  header { padding: 18px 20px 8px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .hello { font-size: 13px; color: var(--muted); }
  h1 {
    font-size: 24px; font-weight: 900; margin: 2px 0 0; letter-spacing: .02em;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .count {
    font-size: 12px; color: var(--accent); background: var(--surface); border: 1.5px solid var(--line);
    border-radius: 999px; padding: 6px 12px; white-space: nowrap; box-shadow: var(--shadow);
  }
  .count b { font-size: 15px; font-weight: 900; }

  .controls { display: flex; gap: 8px; padding: 2px 20px 4px; overflow-x: auto; scrollbar-width: none; }
  .controls::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--text);
    border-radius: 999px; padding: 8px 14px; font-size: 13px;
    transition: transform .15s;
  }
  .chip:active, .btn:active, button.add:active, .mic:active, .row:active { transform: scale(.95); }
  .chip.primary {
    border-color: transparent; background: var(--grad); color: #fff;
    box-shadow: 0 6px 16px rgba(255, 111, 168, .35);
  }
  .chip[aria-pressed="true"]:not(.primary) { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  /* タイムライン */
  .stage {
    flex: 1; overflow: hidden;
    touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  }
  .axis {
    position: absolute; left: 0; right: 0; top: 50%; height: 0;
    border-top: 2.5px dotted var(--accent-2); opacity: .5;
  }
  .track { position: absolute; inset: 0; }
  .slot { position: absolute; top: 0; left: 0; width: 180px; height: 100%; will-change: transform; }
  .bob { position: absolute; inset: 0; display: flex; align-items: center; }
  .c0 { --cbg: var(--c0-bg); --bd: var(--c0-bd); --ink: var(--c0-ink); }
  .c1 { --cbg: var(--c1-bg); --bd: var(--c1-bd); --ink: var(--c1-ink); }
  .c2 { --cbg: var(--c2-bg); --bd: var(--c2-bd); --ink: var(--c2-ink); }
  .c3 { --cbg: var(--c3-bg); --bd: var(--c3-bd); --ink: var(--c3-ink); }
  .c4 { --cbg: var(--c4-bg); --bd: var(--c4-bd); --ink: var(--c4-ink); }
  .card {
    position: relative; width: calc(100% - 12px); margin: 0 auto; min-height: 96px;
    background: var(--cbg); border: 2px solid var(--bd);
    border-radius: 22px; padding: 12px 14px 12px; box-shadow: var(--shadow);
    font-size: 15px; line-height: 1.45; word-break: break-word; cursor: pointer;
    transition: transform .2s;
  }
  .slot.overdue .card { border-color: var(--warn); }
  .slot.star .card {
    transform: scale(1.08); border-color: var(--star);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--star) 30%, transparent), 0 10px 28px color-mix(in srgb, var(--star) 35%, transparent);
  }
  .card .badge { position: absolute; top: -10px; right: -6px; font-size: 18px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.15)); }
  .card.pressing { transform: scale(.92) !important; transition: transform .55s cubic-bezier(.3, .0, .3, 1); }
  .card-top { display: flex; gap: 8px; align-items: flex-start; }
  .emo {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center; font-size: 17px;
    background: var(--surface); box-shadow: 0 0 0 2px var(--bd);
  }
  .title { font-weight: 700; padding-top: 4px; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 8px; font-size: 11px; }
  .tag { border-radius: 999px; padding: 2px 8px; background: var(--surface); color: var(--ink, var(--accent)); font-weight: 700; }
  .tag.today { background: var(--ink, var(--accent)); color: var(--surface); }
  .tag.overdue { background: var(--warn); color: #fff; }
  .slot.done .card { opacity: .55; }
  .slot.done .title { text-decoration: line-through; text-decoration-thickness: 2px; }

  .empty {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--muted); font-size: 14px; text-align: center; padding: 24px; line-height: 2.1;
  }
  .empty .big { font-size: 40px; line-height: 1.2; margin-bottom: 6px; }
  .empty b { color: var(--accent); font-weight: 700; }
  .tip {
    position: absolute; left: 0; right: 0; bottom: 8px; text-align: center;
    font-size: 11px; color: var(--muted); pointer-events: none;
  }

  /* 今やる1つ */
  .focus {
    position: absolute; inset: 0; z-index: 2;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; gap: 14px;
  }
  .focus-label {
    font-size: 13px; font-weight: 700; color: var(--accent);
    background: var(--surface); border-radius: 999px; padding: 5px 14px; box-shadow: var(--shadow);
  }
  #focusBody { width: min(340px, 100%); display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .focus-card {
    position: relative;
    width: 100%; min-height: 170px; padding: 26px 22px 22px; border-radius: 30px; text-align: center;
    background: var(--cbg); border: 2.5px solid var(--bd); box-shadow: var(--shadow);
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px;
    touch-action: none; cursor: grab;
  }
  .focus-card.star { border-color: var(--star); }
  .focus-card .badge { position: absolute; top: -12px; right: 14px; font-size: 26px; }
  .focus-card.enter { animation: enter .5s cubic-bezier(.2, .9, .3, 1.35); }
  @keyframes enter { from { transform: translateX(45vw) scale(.8) rotate(6deg); opacity: 0; } }
  .focus-card .emo { width: 56px; height: 56px; font-size: 30px; box-shadow: 0 0 0 3px var(--bd); }
  .focus-title { font-size: 22px; font-weight: 900; line-height: 1.45; word-break: break-word; color: var(--text); }
  .focus-card .meta { justify-content: center; font-size: 12px; margin: 0; }
  .focus-hint { font-size: 12px; color: var(--muted); text-align: center; }
  .focus-btns { display: flex; gap: 10px; }
  .btn {
    padding: 12px 22px; font-size: 15px; border-radius: 999px;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--text);
    transition: transform .15s;
  }
  .btn.go { border-color: transparent; background: var(--grad); color: #fff; box-shadow: 0 6px 16px rgba(255, 111, 168, .35); }
  .focus-clear { font-size: 18px; font-weight: 700; text-align: center; line-height: 1.9; }
  .focus-clear .big { font-size: 48px; }

  .timer { width: min(340px, 100%); display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .timer-row { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; justify-content: center; }
  .timer-row .chip { padding: 6px 12px; }
  .timer-left { font-size: 34px; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--accent); }
  .bar { width: 100%; height: 10px; border-radius: 10px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 10px; background: var(--grad); width: 0; transition: width 1s linear; }

  /* 入力欄 */
  .composer {
    margin: 0 12px 8px;
    padding: 8px 10px 10px;
    background: var(--surface); border: 1.5px solid var(--line);
    border-radius: 24px; box-shadow: var(--shadow);
  }
  .preview { min-height: 20px; font-size: 12px; color: var(--accent); padding: 0 6px 6px; font-weight: 700; }
  form.input-row { display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0; font-size: 16px; padding: 11px 14px; font-family: inherit; font-weight: 500;
    border-radius: 16px; border: 1.5px solid var(--line); background: var(--bg); color: var(--text);
  }
  input::placeholder { color: var(--muted); }
  input:focus { outline: none; border-color: var(--accent); }
  .mic {
    width: 46px; flex: none; border-radius: 16px; border: 0;
    background: var(--accent-soft); color: var(--accent); display: grid; place-items: center;
    transition: transform .15s;
  }
  .mic svg { width: 22px; height: 22px; }
  .mic.listening { background: var(--grad); color: #fff; animation: listen 1.1s ease-in-out infinite; }
  @keyframes listen { 50% { box-shadow: 0 0 0 8px var(--accent-soft); } }
  button.add {
    border: 0; border-radius: 16px; padding: 0 16px; font-size: 15px;
    background: var(--grad); color: #fff; transition: transform .15s;
  }

  /* お知らせ */
  .toast {
    position: fixed; left: 16px; right: 16px; z-index: 40;
    bottom: calc(130px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 12px; justify-content: space-between;
    padding: 12px 16px; border-radius: 18px;
    background: var(--text); color: var(--bg); font-weight: 700;
    font-size: 14px; transform: translateY(12px) scale(.96); opacity: 0; pointer-events: none;
    transition: transform .25s cubic-bezier(.2, .9, .3, 1.3), opacity .2s;
  }
  .toast.show { transform: none; opacity: 1; pointer-events: auto; }
  .toast button { flex: none; border: 0; background: none; color: var(--accent); font-size: 14px; padding: 4px; }

  /* 紙吹雪 */
  .confetti { position: fixed; inset: 0; z-index: 50; pointer-events: none; overflow: hidden; }
  .confetti span {
    position: absolute; left: var(--x); top: var(--y); font-size: var(--s);
    animation: pop 1.2s cubic-bezier(.15, .7, .3, 1) forwards;
  }
  .confetti span.p { width: 9px; height: 13px; border-radius: 3px; background: var(--c); }
  @keyframes pop {
    0% { transform: translate(-50%, -50%) scale(.3); opacity: 1; }
    70% { opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--r)) scale(1); opacity: 0; }
  }

  /* 下のタブ（タスク／朝） */
  .tabbar {
    position: relative; z-index: 6; display: flex; gap: 8px;
    padding: 6px 16px calc(6px + env(safe-area-inset-bottom));
    background: var(--surface); border-top: 1.5px solid var(--line);
  }
  .tabbar button {
    flex: 1; border: 0; background: none; color: var(--muted);
    font-size: 13px; padding: 6px 0; border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
  }
  .tabbar button span { font-size: 22px; line-height: 1.1; }
  .tabbar button.on { color: var(--accent); background: var(--accent-soft); }
  .page-view {
    position: fixed; left: 0; right: 0; top: env(safe-area-inset-top); bottom: 70px;
    z-index: 5; background: var(--bg);
  }
  .page-view iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  body.running .tabbar { display: none; }
  body.running .page-view { bottom: env(safe-area-inset-bottom); }

  /* シート */
  .sheet-bg {
    position: fixed; inset: 0; z-index: 30; background: rgba(60, 40, 90, .28);
    display: none; align-items: flex-end;
  }
  .sheet-bg.open { display: flex; }
  .sheet {
    width: 100%; background: var(--surface); border-radius: 28px 28px 0 0;
    padding: 22px 16px calc(18px + env(safe-area-inset-bottom));
    max-height: 88vh; overflow-y: auto;
    animation: up .28s cubic-bezier(.2, .9, .3, 1.1);
  }
  .sheet.tall { height: 88vh; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .sheet h2 { margin: 0 0 4px; font-size: 18px; font-weight: 900; }
  .sheet p.title-line { margin: 0 0 4px; font-size: 18px; font-weight: 700; word-break: break-word; }
  .sheet .hint { font-size: 13px; color: var(--muted); margin-bottom: 12px; line-height: 1.7; }
  .row {
    display: block; width: 100%; padding: 14px 16px; margin-top: 8px; font-size: 15px; text-align: left;
    border-radius: 16px; border: 1.5px solid var(--line); background: var(--bg); color: var(--text);
    transition: transform .15s;
  }
  .row small { float: right; color: var(--muted); font-size: 13px; font-weight: 500; }
  .row.center { text-align: center; }
  .row.go { background: var(--grad); color: #fff; border-color: transparent; }
  .danger { color: var(--warn); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }
  .grid button {
    padding: 12px 0; font-size: 14px; border-radius: 16px;
    border: 1.5px solid var(--line); background: var(--bg); color: var(--text);
  }
  .grid button.on { border-color: transparent; color: #fff; background: var(--grad); }
  .custom { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .custom input { flex: 1; }
  .custom span { color: var(--muted); }
  .sub-preview { min-height: 18px; font-size: 12px; color: var(--accent); font-weight: 700; padding: 6px 4px 0; }

  /* できたこと */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 18px; }
  .stat {
    background: var(--bg); border: 1.5px solid var(--line); border-radius: 18px;
    padding: 12px 6px; text-align: center;
  }
  .stat b { display: block; font-size: 26px; font-weight: 900; color: var(--accent); line-height: 1.2; }
  .stat span { font-size: 11px; color: var(--muted); }
  .stat.fire b { background: linear-gradient(120deg, #ff8a3d, #ff4f8b); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .day-head { font-size: 13px; font-weight: 900; color: var(--muted); margin: 16px 4px 6px; display: flex; justify-content: space-between; }
  .done-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 6px;
    background: var(--bg); border-radius: 16px; border: 1.5px solid var(--line);
  }
  .done-item .emo { width: 32px; height: 32px; box-shadow: 0 0 0 2px var(--line); }
  .done-item .txt { flex: 1; min-width: 0; font-weight: 700; word-break: break-word; font-size: 14px; }
  .done-item .txt small { display: block; font-weight: 500; color: var(--muted); font-size: 11px; }
  .done-item button {
    flex: none; border: 0; border-radius: 999px; padding: 6px 10px; font-size: 12px;
    background: var(--surface); color: var(--accent); box-shadow: 0 0 0 1.5px var(--line);
  }
  .done-item button.x { color: var(--muted); padding: 6px 9px; }
  .done-empty { text-align: center; color: var(--muted); padding: 30px 0; line-height: 2; }

  .setting-note { font-size: 12px; color: var(--muted); margin: 6px 4px 0; line-height: 1.7; }
</style>
</head>
<body>
  <div class="bgfx"><i></i><i></i><i></i></div>

  <header>
    <div>
      <div class="hello" id="hello"></div>
      <h1>タスクタイムライン</h1>
    </div>
    <span class="count" id="count"></span>
  </header>
  <div class="controls">
    <button class="chip primary" id="focusBtn" aria-pressed="false">✨ 今やる1つ</button>
    <button class="chip" id="doneBtn">🏆 できたこと</button>
    <button class="chip" id="pause" aria-pressed="false">⏸ 一時停止</button>
    <button class="chip" id="speedBtn"></button>
    <button class="chip" id="settingsBtn" aria-label="設定">⚙️</button>
  </div>

  <div class="stage" id="stage">
    <div class="axis"></div>
    <div class="track" id="track"></div>
    <div class="empty" id="empty">
      <div><div class="big">🌷</div>マイクを押して話すだけで追加できるよ<br>
      <b>「明日15時に歯医者」</b><br><b>「毎朝7時に薬」</b><br><b>「金曜までにレポート！」</b>（！で⭐大事）</div>
    </div>
    <div class="tip" id="tip">タップでメニュー ・ 長押しで完了 💖</div>
    <div class="focus" id="focus" hidden>
      <div class="focus-label">✨ 今やること</div>
      <div id="focusBody"></div>
      <div class="timer" id="timer"></div>
    </div>
  </div>

  <div class="composer">
    <div class="preview" id="preview"></div>
    <form class="input-row" id="form" autocomplete="off">
      <button class="mic" id="mic" type="button" aria-label="話して追加">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11.5" rx="3"/><path d="M5.5 10.5a6.5 6.5 0 0 0 13 0M12 17v4"/></svg>
      </button>

<script>
const KEY = 'task-app:tasks';
const LOG_KEY = 'task-app:log';
const SPEED_KEY = 'task-app:crossMinutes';
const BACKUP_KEY = 'task-app:lastBackup';   // 最後にバックアップした時刻（ミリ秒）
const NAG_KEY = 'task-app:backupNag';       // 最後に「保存しておく？」と出した時刻
const SLOT_W = 180;
const SPEED_CHOICES = [1 / 6, 0.5, 1, 2, 3, 5, 10, 30];
const WD = '日月火水木金土';
const DAY = 86400e3;

function read(key, fallback) {
  try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch { return fallback; }
}
function write(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

let tasks = read(KEY, []);
let log = read(LOG_KEY, []);   // 完了の記録 { id, taskId, title, at, repeat }
let crossMinutes = read(SPEED_KEY, 1);
let offset = 0, paused = false, dragging = false, lastX = 0, moved = 0;
let selectedId = null;
let view = [], slots = [];
let focusMode = false, skipped = new Set(), current = null;

const $ = id => document.getElementById(id);
const track = $('track'), stage = $('stage');
const save = () => { write(KEY, tasks); write(LOG_KEY, log); };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const withTime = (d, h, mi) => new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, mi);
const dayKey = ts => { const d = new Date(ts); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
const sameDay = (a, b) => dayKey(a) === dayKey(b);

// 以前のデータの引き継ぎ：完了済みなのに記録がないものを記録に入れる
tasks.forEach(t => {
  if (t.done && !t.doneAt) {
    t.doneAt = Date.now();
    log.push({ id: newId(), taskId: t.id, title: t.title, at: t.doneAt, repeat: false });
  }
});
save();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}

/* ───────── 絵文字と色 ───────── */
const EMOJI = [
  [/歯医者|歯科|歯/, '🦷'], [/病院|通院|診察|健診|検診/, '🏥'], [/薬|サプリ/, '💊'],
  [/ゴミ|ごみ/, '🗑️'], [/会議|ミーティング|打ち合わせ|mtg/i, '💼'], [/電話|連絡|tel/i, '📞'],
  [/メール|返信|LINE|ライン/i, '💌'], [/買|購入|スーパー|コンビニ|牛乳|卵/, '🛍️'],
  [/支払|払う|家賃|振込|請求|税/, '💸'], [/掃除|片付け|片づけ/, '🧹'], [/洗濯/, '🧺'],
  [/料理|ご飯|ごはん|夕飯|朝ごはん|ランチ|弁当/, '🍳'], [/ジム|筋トレ|運動|ストレッチ|ヨガ|ランニング/, '💪'],
  [/美容院|美容室|ネイル|まつげ|カット/, '💇‍♀️'], [/レポート|資料|書類|提出|課題|宿題/, '📝'],
  [/勉強|読書|本/, '📚'], [/日記|ノート/, '📔'], [/誕生日|プレゼント/, '🎁'],
  [/旅行|予約|ホテル|チケット/, '✈️'], [/出勤|仕事|会社/, '👜'], [/寝る|睡眠|早寝/, '🌙'],
  [/水やり|花|植物/, '🌱'], [/水|ドリンク/, '🥤'], [/猫|ねこ/, '🐱'], [/犬|いぬ|散歩/, '🐶'],
  [/カフェ|コーヒー/, '☕'], [/デート|会う|友達/, '💕'], [/お風呂|風呂|シャワー/, '🛁'],
];
const FALLBACK = ['🌷', '✨', '🍓', '🫧', '🎀', '🌈', '💫', '🍑'];
const hash = (s, seed, mul) => { let h = seed; for (const c of String(s)) h = (h * mul + c.charCodeAt(0)) >>> 0; return h; };
function emojiFor(t) {
  for (const [re, e] of EMOJI) if (re.test(t.title)) return e;
  return FALLBACK[hash(t.id, 0, 31) % FALLBACK.length];
}
const colorFor = t => `c${hash(t.id, 7, 17) % 5}`;

/* ───────── 繰り返し ───────── */
function occurs(rep, d) {
  const dow = d.getDay();
  if (rep.type === 'daily') return true;
  if (rep.type === 'weekdays') return dow >= 1 && dow <= 5;
  if (rep.type === 'weekly') return rep.days.includes(dow);
  if (rep.type === 'monthly') {
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    return d.getDate() === Math.min(rep.day, last);
  }
  return false;
}
// from の日（含む）以降で、最初に当てはまる日時
function firstOccurrence(rep, from, h, mi, allDay) {
  const now = new Date();
  for (let i = 0; i < 400; i++) {
    const day = addDays(startOfDay(from), i);
    if (!occurs(rep, day)) continue;
    const at = allDay ? day : withTime(day, h, mi);
    if (allDay ? day >= startOfDay(now) : at > now) return at;
  }
  return null;
}
function nextDue(t) {
  const d = new Date(t.due);
  return firstOccurrence(t.repeat, addDays(startOfDay(d), 1), d.getHours(), d.getMinutes(), t.allDay)?.getTime() ?? null;
}
function repeatLabel(rep) {
  if (!rep) return '';
  if (rep.type === 'daily') return '毎日';
  if (rep.type === 'weekdays') return '平日';
  if (rep.type === 'weekly') return `毎週${rep.days.map(i => WD[i]).join('・')}`;
  if (rep.type === 'monthly') return `毎月${rep.day}日`;
  return '';
}

/* ───────── 日本語の日時を読み取る ───────── */
function parseJa(raw) {
  let text = raw.replace(/[０-９：／]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  const now = new Date();
  const today = startOfDay(now);
  let date = null, h = null, mi = 0, m, repeat = null, night = false;
  const take = re => { const r = text.match(re); if (r) text = text.replace(r[0], ' '); return r; };

  // 最後に「！」があれば大事マーク
  let star = false;
  if (/[!！]+\s*$/.test(text)) { star = true; text = text.replace(/[!！]+\s*$/, ''); }

  // 繰り返し
  if (take(/平日/)) repeat = { type: 'weekdays' };
  else if ((m = take(/毎月\s*(\d{1,2})\s*日/))) repeat = { type: 'monthly', day: +m[1] };
  else if ((m = take(/毎週\s*([日月火水木金土・、と曜]+)/))) {
    const days = [...new Set([...m[1].replace(/曜日?/g, '')].filter(c => WD.includes(c)).map(c => WD.indexOf(c)))].sort();
    repeat = { type: 'weekly', days: days.length ? days : [today.getDay()] };
  } else if ((m = take(/毎\s*([日月火水木金土])曜日?/))) repeat = { type: 'weekly', days: [WD.indexOf(m[1])] };
  else if ((m = take(/毎(日|朝|晩|夜)/))) { repeat = { type: 'daily' }; night = m[1] === '晩' || m[1] === '夜'; }
  else if (take(/毎週/)) repeat = { type: 'weekly', days: [today.getDay()] };
  else if (take(/毎月/)) repeat = { type: 'monthly', day: today.getDate() };

  // ○時間後・○分後
  if (!repeat && ((m = take(/(\d+)\s*時間後/)) || (m = take(/(\d+)\s*分後/)))) {
    const ms = m[0].includes('時間') ? +m[1] * 3600e3 : +m[1] * 60e3;
    return finish(text, raw, new Date(now.getTime() + ms), false, null, star);
  }

  // 日付
  if (!repeat) {
    if ((m = take(/(\d+)\s*日後/))) date = addDays(today, +m[1]);
    else if (take(/明後日|あさって/)) date = addDays(today, 2);
    else if (take(/明日|あした/)) date = addDays(today, 1);
    else if (take(/今日|きょう/)) date = today;
    else if ((m = take(/(\d{1,2})\s*月\s*(\d{1,2})\s*日/)) || (m = take(/(\d{1,2})\/(\d{1,2})/))) {
      date = new Date(today.getFullYear(), +m[1] - 1, +m[2]);
      if (date < today) date.setFullYear(date.getFullYear() + 1);
    } else if ((m = take(/(今週|来週|再来週)?\s*の?\s*([日月火水木金土])曜日?/))) {
      const target = WD.indexOf(m[2]);
      const dow = today.getDay();
      if (m[1]) {
        const monday = addDays(today, -((dow + 6) % 7));
        date = addDays(monday, (target + 6) % 7 + { 今週: 0, 来週: 1, 再来週: 2 }[m[1]] * 7);
      } else {
        date = addDays(today, (target - dow + 7) % 7);
      }
    } else if ((m = take(/(\d{1,2})\s*日/))) {
      date = new Date(today.getFullYear(), today.getMonth(), +m[1]);
      if (date < today) date.setMonth(date.getMonth() + 1);
    }
  }

  // 時刻
  let ampm = null;
  if ((m = take(/(午前|午後|朝|夜|夕方|夜中)?\s*(\d{1,2})\s*時\s*(半|(\d{1,2})\s*分)?/))) {
    ampm = m[1]; h = +m[2]; mi = m[3] === '半' ? 30 : (m[4] ? +m[4] : 0);
  } else if ((m = take(/(午前|午後|朝|夜|夕方)?\s*(\d{1,2}):(\d{2})/))) {
    ampm = m[1]; h = +m[2]; mi = +m[3];
  }
  if (h !== null) {
    if (!ampm && night) ampm = '夜';
    if (['午後', '夜', '夕方'].includes(ampm) && h < 12) h += 12;
    if (ampm === '午前' && h === 12) h = 0;
    if (h > 23 || mi > 59) h = null;
  }

  if (repeat) {
    const allDay = h === null;
    const first = firstOccurrence(repeat, today, h ?? 0, mi, allDay);
    return finish(text, raw, first, allDay, repeat, star);
  }
  if (date && h !== null) return finish(text, raw, withTime(date, h, mi), false, null, star);
  if (date) return finish(text, raw, date, true, null, star);
  if (h !== null) {
    let d = withTime(today, h, mi);
    if (d < now) d = withTime(addDays(today, 1), h, mi);
    return finish(text, raw, d, false, null, star);
  }
  return finish(text, raw, null, false, null, star);
}
function finish(text, raw, d, allDay, repeat, star) {
  let title = text.replace(/[\s。、]+/g, ' ').trim();
  if (d || repeat) {
    title = text
      .replace(/(^|\s)(までには|までに|まで|には|に|から|の|は|で|、|,)+/g, '$1')
      .replace(/[\s。、]+/g, ' ').trim();
  }
  return { title: title || raw.replace(/[!！]+\s*$/, '').trim(), due: d ? d.getTime() : null, allDay, repeat, star };
}

/* ───────── 表示用 ───────── */
function dayLabel(ts) {
  const d = new Date(ts);
  const diff = Math.round((startOfDay(d) - startOfDay(new Date())) / DAY);
  return diff === 0 ? '今日' : diff === 1 ? '明日' : diff === 2 ? 'あさって' : diff === -1 ? '昨日'
    : `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`;
}
function dueLabel(t) {
  if (!t.due) return '';
  const d = new Date(t.due);
  return t.allDay ? dayLabel(t.due) : `${dayLabel(t.due)} ${d.getHours()}:${pad(d.getMinutes())}`;
}
function isOverdue(t) {
  if (!t.due || t.done) return false;
  return t.allDay ? startOfDay(new Date(t.due)) < startOfDay(new Date()) : t.due < Date.now();
}
const isToday = t => t.due && !t.done && sameDay(t.due, Date.now());
// 終日は「その日の終わり」として比べる
const dueKey = t => !t.due ? Infinity : t.allDay ? t.due + DAY - 1 : t.due;
// 並び順：未完了 → ⭐大事 → 期限が近い → 古い順
const byPriority = (a, b) => (!!a.done - !!b.done) || (!!b.star - !!a.star) || dueKey(a) - dueKey(b) || a.created - b.created;

function metaHtml(t) {
  const parts = [];
  if (t.due) {
    const cls = isOverdue(t) ? 'overdue' : isToday(t) ? 'today' : '';
    parts.push(`<span class="tag ${cls}">${isOverdue(t) ? '⚠ 期限切れ ' : '🕒 '}${dueLabel(t)}</span>`);
  }
  if (t.repeat) parts.push(`<span class="tag">🔁 ${repeatLabel(t.repeat)}</span>`);
  return parts.length ? `<div class="meta">${parts.join('')}</div>` : '';
}

/* ───────── 記録（できたこと） ───────── */
function streak() {
  const days = new Set(log.map(e => dayKey(e.at)));
  let d = startOfDay(new Date());
  if (!days.has(dayKey(d))) d = addDays(d, -1); // 今日まだでも、昨日まで続いていれば継続中
  let n = 0;
  while (days.has(dayKey(d))) { n++; d = addDays(d, -1); }
  return n;
}
const todayDone = () => log.filter(e => sameDay(e.at, Date.now())).length;

/* ───────── タイムライン ───────── */
// タイムラインに出すもの：未完了＋今日完了したもの（翌日には「できたこと」へ）
const onTimeline = () => tasks.filter(t => !t.done || sameDay(t.doneAt, Date.now()));
// カードは横一列に並べる
const STEP = SLOT_W;
// 一周の長さ：全部が1列に並ぶ長さ。画面より短いときは「画面の幅＋カード1枚分」にして、
// 列が途切れず右端から戻ってくるようにする
const loopLen = () => Math.max(view.length * STEP, stage.clientWidth + SLOT_W);

function greet() {
  const now = new Date(), h = now.getHours();
  const hi = h < 5 ? 'おつかれさま 🌙' : h < 11 ? 'おはよう ☀️' : h < 17 ? 'こんにちは 🌷' : 'こんばんは 🌙';
  return `${hi}　${now.getMonth() + 1}月${now.getDate()}日 (${WD[now.getDay()]})`;
}

function render() {
  $('hello').textContent = greet();
  view = onTimeline().sort(byPriority);
  const left = tasks.filter(t => !t.done).length;
  const todayN = tasks.filter(t => isToday(t) || isOverdue(t)).length;
  $('count').innerHTML = tasks.length ? `今日 <b>${todayN}</b> ・ 残り <b>${left}</b>` : 'タスク 0 🫧';
  const s = streak(), td = todayDone();
  $('doneBtn').textContent = `🏆 できたこと${td ? ` ${td}` : ''}${s >= 2 ? ` · 🔥${s}日` : ''}`;
  $('empty').style.display = view.length || focusMode ? 'none' : 'grid';
  $('tip').hidden = !view.length || focusMode;

  track.innerHTML = '';
  slots = [];
  if (!view.length) return;
  // 1つのタスクにつきカードは1枚だけ
  const frag = document.createDocumentFragment();
  view.forEach((t, i) => {
    const slot = document.createElement('div');
    const state = (t.done ? ' done' : isOverdue(t) ? ' overdue' : '') + (t.star && !t.done ? ' star' : '');
    slot.className = `slot ${colorFor(t)}${state}`;
    slot.innerHTML = `<div class="bob">
      <div class="card" data-id="${t.id}">${t.star && !t.done ? '<span class="badge">⭐</span>' : ''}<div class="card-top"><span class="emo">${t.done ? '✅' : emojiFor(t)}</span><div class="title"></div></div>${metaHtml(t)}</div></div>`;
    slot.querySelector('.title').textContent = t.title;
    slots.push(slot);
    frag.appendChild(slot);
  });
  track.appendChild(frag);
  placeSlots();
}
function placeSlots() {
  const L = loopLen();
  offset = ((offset % L) + L) % L;
  slots.forEach((s, i) => {
    // ひとつながりの列で左へ流れ、左端の外へ出たら右端に戻る
    const x = ((stage.clientWidth * .3 + i * STEP - offset) % L + L) % L;
    s.style.transform = `translateX(${x - SLOT_W}px)`;
  });
}

let prev = performance.now();
function tick(now) {
  const dt = Math.min(now - prev, 100) / 1000;
  prev = now;
  if (slots.length) {
    // 画面の幅を crossMinutes 分で横切る速さ
    if (!paused && !dragging && !focusMode) offset += stage.clientWidth / (crossMinutes * 60) * dt;
    placeSlots();
  }
  requestAnimationFrame(tick);
}

/* ───────── なぞる・タップ・長押し ───────── */
let pressTimer = null, pressCard = null, pressFired = false;
function cancelPress() {
  clearTimeout(pressTimer);
  pressTimer = null;
  if (pressCard) pressCard.classList.remove('pressing');
}
stage.addEventListener('contextmenu', e => e.preventDefault());
stage.addEventListener('pointerdown', e => {
  if (focusMode) return;
  dragging = true; lastX = e.clientX; moved = 0; pressFired = false;
  pressCard = e.target.closest && e.target.closest('.card');
  const t = pressCard && tasks.find(t => t.id === pressCard.dataset.id);
  if (t && !t.done) {
    pressCard.classList.add('pressing');
    pressTimer = setTimeout(() => {
      pressFired = true;
      const r = pressCard.getBoundingClientRect();
      cancelPress();
      complete(t, r.left + r.width / 2, r.top + r.height / 2);
    }, 550);
  }
});
window.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  lastX = e.clientX; moved += Math.abs(dx);
  offset -= dx;
  if (moved > 8) cancelPress();
});
window.addEventListener('pointerup', () => {
  if (!dragging) return;
  dragging = false;
  const card = pressCard;
  cancelPress();

/* ───────── 紙吹雪 ───────── */
const CHEERS = ['やったね！', 'えらい！', 'すごい！', 'さすが！', 'いい感じ！', 'ナイス！'];
const PARTY = ['💖', '✨', '🎉', '💕', '⭐', '🌸'];

function confetti(x = innerWidth / 2, y = innerHeight / 2) {

  const box = $('confetti');
  for (let i = 0; i < 34; i++) {
    const s = document.createElement('span');
    const ang = Math.random() * Math.PI * 2;
    const dist = 90 + Math.random() * 170;
    if (i % 3 === 0) { s.textContent = PARTY[i % PARTY.length]; s.style.setProperty('--s', `${16 + Math.random() * 12}px`); }
    else { s.className = 'p'; s.style.setProperty('--c', PAPER[i % PAPER.length]); }

    s.style.setProperty('--y', `${y}px`);
    s.style.setProperty('--dx', `${Math.cos(ang) * dist}px`);

    s.style.setProperty('--r', `${Math.random() * 720 - 360}deg`);

  }
  try { navigator.vibrate && navigator.vibrate(30); } catch {}
}

/* ───────── 完了（繰り返しは次の回へ・記録に残す） ───────── */

  } else {

/* ───────── 延期 ───────── */
let snoozeTarget = null;
function snoozeOptions() {
  const now = new Date(), today = startOfDay(now);

  const opts = [
    ['☕ 30分後', new Date(now.getTime() + 30 * 60e3)],
    ['🕐 1時間後', new Date(now.getTime() + 60 * 60e3)],
    ['🕒 3時間後', new Date(now.getTime() + 3 * 3600e3)],
  ];
  if (now.getHours() < 19) opts.push(['🌙 今夜', withTime(today, 20, 0)]);
  opts.push(['☀️ 明日の朝', withTime(addDays(today, 1), 9, 0)]);
  if (dow !== 5 && dow !== 6) opts.push(['🎈 週末', withTime(addDays(today, (6 - dow + 7) % 7), 10, 0)]);
  opts.push(['📅 来週', withTime(addDays(today, (8 - dow) % 7 || 7), 9, 0)]);
  return opts;
}

/* ───────── 今やる1つ ───────── */
function pickNext() {

  if (!candidates.length) return null;
  let rest = candidates.filter(t => !skipped.has(t.id));
  if (!rest.length) { skipped.clear(); rest = candidates; }
  return rest[0];
}
function showFocus(animate) {
  current = pickNext();
  const body = $('focusBody');
  if (!current) {
    body.innerHTML = tasks.length
      ? '<div class="focus-clear"><div class="big">🎉</div>全部おわったよ！<br>えらすぎる〜！</div>'
      : '<div class="focus-clear"><div class="big">🌷</div>タスクを追加すると<br>ここに1つずつ出てくるよ</div>';
    renderTimer();
    return;
  }
  body.innerHTML = `
    <div class="focus-card ${colorFor(current)}${current.star ? ' star' : ''}${animate ? ' enter' : ''}" id="focusCard">
      ${current.star ? '<span class="badge">⭐</span>' : ''}

    </div>`;
  body.querySelector('.focus-title').textContent = current.title;
  $('fLater').onclick = () => openSnooze(current);
  $('fDone').onclick = () => fling(1);
  bindSwipe($('focusCard'));
  renderTimer();
}
function fling(dir) {
  const card = $('focusCard');
  if (!card || !current) return;
  if (dir < 0) {
    // 延期を選ぶ間、カードは元の位置へ
    card.style.transition = 'transform .25s';
    card.style.transform = '';
    return openSnooze(current);
  }
  const t = current;
  const r = card.getBoundingClientRect();
  card.style.transition = 'transform .28s ease-in, opacity .28s';
  card.style.transform = 'translateX(110vw) rotate(14deg)';
  card.style.opacity = '0';
  stopTimer(false);
  setTimeout(() => { complete(t, r.left + r.width / 2, r.top + r.height / 2); showFocus(true); }, 240);
}
function bindSwipe(card) {
  let sx = null, dx = 0;
  card.addEventListener('pointerdown', e => {
    sx = e.clientX; dx = 0;
    card.setPointerCapture(e.pointerId);
    card.style.transition = 'none';
    card.style.animation = 'none';
  });
  card.addEventListener('pointermove', e => {
    if (sx === null) return;
    dx = e.clientX - sx;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
  });
  const end = () => {
    if (sx === null) return;
    sx = null;
    if (Math.abs(dx) > 80) return fling(Math.sign(dx));
    card.style.transition = 'transform .25s';
    card.style.transform = '';
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}
$('focusBtn').onclick = () => {

/* ───────── 集中タイマー ───────── */
let timer = null; // { end, total }
let timerTick = null;
function renderTimer() {
  const box = $('timer');
  if (!current) { box.innerHTML = ''; return; }
  if (!timer) {
    box.innerHTML = `<div class="timer-row">⏱ 集中タイマー
      <button class="chip" data-min="15">15分</button>
      <button class="chip" data-min="25">25分</button>
      <button class="chip" data-min="50">50分</button></div>`;
    box.querySelectorAll('[data-min]').forEach(b => b.onclick = () => startTimer(+b.dataset.min));
    return;
  }
  const left = Math.max(0, timer.end - Date.now());
  const s = Math.ceil(left / 1000);
  box.innerHTML = `<div class="timer-left">${Math.floor(s / 60)}:${pad(s % 60)}</div>
    <div class="bar"><i style="width:${100 - left / timer.total * 100}%"></i></div>
    <div class="timer-row"><button class="chip" id="timerStop">タイマーを止める</button></div>`;
  $('timerStop').onclick = () => stopTimer(false);
}
function startTimer(min) {
  timer = { end: Date.now() + min * 60e3, total: min * 60e3 };
  clearInterval(timerTick);
  timerTick = setInterval(() => {
    if (Date.now() >= timer.end) return stopTimer(true);
    if (focusMode) renderTimer();
  }, 1000);
  renderTimer();
}
function stopTimer(finished) {
  clearInterval(timerTick);
  timer = null;
  renderTimer();
  if (finished) {
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch {}
    chime();
    confetti();
    toast('⏱ 時間だよ！おつかれさま 💖');

  }
}
function chime() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1175, 1568].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = f; o.type = 'sine';
      const t0 = ac.currentTime + i * .18;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(.18, t0 + .02);
      g.gain.exponentialRampToValueAtTime(.001, t0 + .6);
      o.connect(g).connect(ac.destination);
      o.start(t0); o.stop(t0 + .65);
    });
  } catch {}
}

  if (!canNotify()) {
    state = '未対応';
    note = isIOS && !standalone ? 'iPhoneでは「ホーム画面に追加」したアプリから開くと、通知をオンにできます。' : 'このブラウザは通知に未対応です。アプリの中のお知らせと音で知らせます。';
  } else if (Notification.permission === 'granted') {
    state = 'オン';
    note = '期限の時間になると通知します（今はアプリを開いているときだけ）。';
  } else if (Notification.permission === 'denied') {
    state = 'ブロック中';
    note = '端末の設定で、このアプリの通知を許可してください。';
  } else {
    state = 'オフ';
    note = 'タップすると通知をオンにできます。オフでも、アプリの中のお知らせと音で知らせます。';
  }
  $('notifyState').textContent = state;
  $('notifyNote').textContent = note;
}
$('notifyBtn').onclick = async () => {
  if (!canNotify() || Notification.permission !== 'default') return updateNotifyUI();
  try { await Notification.requestPermission(); } catch {}
  updateNotifyUI();
  if (Notification.permission === 'granted') sysNotify('🔔 通知をオンにしたよ', '期限の時間になったら知らせるね');
};
function sysNotify(title, body) {
  if (!canNotify() || Notification.permission !== 'granted') return;
  const opts = { body, icon: 'icon-192.png', badge: 'icon-192.png' };
  try {
    if (swReg) swReg.showNotification(title, opts);
    else new Notification(title, opts);
  } catch {}
}
function checkDue() {
  const now = Date.now();
  let changed = false;
  for (const t of tasks) {
    if (t.done || !t.due || t.allDay || t.notified === t.due) continue;
    if (t.due <= now && now - t.due < 10 * 60e3) {
      t.notified = t.due;
      changed = true;
      chime();
      try { navigator.vibrate && navigator.vibrate([150, 80, 150]); } catch {}
      toast(`🔔 「${t.title}」の時間だよ`);
      sysNotify(`🔔 ${t.title}`, `${dueLabel(t)} の予定だよ`);
    }
  }
  if (changed) save();
}

/* ───────── バックアップ ───────── */
$('exportBtn').onclick = async () => {
  const data = { app: 'task-app', version: 1, exportedAt: new Date().toISOString(), tasks, log, crossMinutes };
  const d = new Date();
  const name = `task-backup-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.json`;
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'タスクのバックアップ' });
      markBackedUp();
      toast('💾 バックアップを保存したよ');
      return;
    }
  } catch (err) { if (err && err.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  markBackedUp();
  toast('💾 バックアップを保存したよ');
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || data.app !== 'task-app' || !Array.isArray(data.tasks)) throw new Error('bad');
    // 今あるものは残して、ないものだけ足す
    const ids = new Set(tasks.map(t => t.id));
    const addT = data.tasks.filter(t => t && t.id && t.title && !ids.has(t.id));
    const logIds = new Set(log.map(x => x.id));
    const addL = (Array.isArray(data.log) ? data.log : []).filter(x => x && x.id && !logIds.has(x.id));
    tasks.push(...addT);
    log.push(...addL);
    markBackedUp();
    closeAll();
    refresh();
    toast(`📂 タスク${addT.length}個・記録${addL.length}個を戻したよ`);
  } catch {
    toast('このファイルは読み込めなかったよ');
  }
};
$('settingsBtn').onclick = () => { updateNotifyUI(); updateBackupUI(); open('settingsSheet'); };

/* ───────── バックアップのお知らせ ───────── */
// しばらく保存していないときに「保存しておく？」と出す（1日に1回まで）
const BACKUP_EVERY = 7 * DAY;
function markBackedUp() { write(BACKUP_KEY, Date.now()); updateBackupUI(); }
function agoLabel(ts) {
  const days = Math.floor((startOfDay(new Date()) - startOfDay(new Date(ts))) / DAY);
  return days <= 0 ? '今日' : days === 1 ? '昨日' : `${days}日前`;
}
function updateBackupUI() {
  const last = read(BACKUP_KEY, null);
  $('backupState').textContent = last ? `最後に保存：${agoLabel(last)}` : 'まだ保存していません';
}
function checkBackup() {
  if (!tasks.length) return;
  const now = Date.now();
  const last = read(BACKUP_KEY, null);
  // 一度も保存していなければ、一番古いタスクを作った日から数える
  const since = last ?? Math.min(...tasks.map(t => t.created || now));
  if (now - since < BACKUP_EVERY) return;
  if (now - read(NAG_KEY, 0) < DAY) return;
  write(NAG_KEY, now);
  const msg = last ? `💾 前の保存から${Math.floor((now - last) / DAY)}日。保存しとく？` : '💾 バックアップ保存しとく？';
  toast(msg, () => $('exportBtn').click(), { label: '保存する', ms: 15000 });
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) setTimeout(checkBackup, 1500); });

/* ───────── 下のタブ（タスク／朝／今日／夜）───────── */
// タスク以外の画面は、別ファイルを中に表示している（同じサイトなのでデータを共有できる）
// タスクのデータを書き換えるのはこの画面だけ。ほかの画面からは postMessage で頼まれる。
const PAGES = {
  morning: { src: 'morning.html', title: 'Good Morning Routine' },
  today: { src: 'today.html', title: '今日のプラン' },
  night: { src: 'night.html', title: '夜のふりかえり' }
};
const frames = {};
let tab = 'tasks';
function fitPages() { $('pageView').style.bottom = $('tabbar').offsetHeight + 'px'; }
function setTab(t, action) {
  if (t !== 'tasks' && !PAGES[t]) t = 'tasks';
  tab = t;
  document.querySelectorAll('#tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  const pv = $('pageView');
  Object.keys(frames).forEach(k => { frames[k].hidden = k !== t; });
  if (t === 'tasks') {
    pv.hidden = true;
    document.body.classList.remove('running');
    render();
  } else {
    let f = frames[t];
    if (!f) {
      f = document.createElement('iframe');
      f.src = PAGES[t].src + (action ? '#' + action : '');
      f.title = PAGES[t].title;
      f.allow = 'screen-wake-lock; microphone; geolocation; autoplay';
      pv.appendChild(f);
      frames[t] = f;
    } else {
      f.contentWindow.postMessage({ type: 'refresh' }, location.origin);
      if (action) f.contentWindow.postMessage({ type: 'action', action }, location.origin);
    }
    pv.hidden = false;
    if (t !== 'morning') document.body.classList.remove('running');
    fitPages();
  }
  history.replaceState(null, '', t === 'tasks' ? location.pathname : '#' + t);
}
$('tabbar').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); });

// ほかの画面からのタスク変更
function taskOp(d) {
  const t = tasks.find(x => x.id === d.id);
  if (d.op === 'add' && d.text) { addTask(d.text); return; }
  if (!t) return;
  if (d.op === 'complete' && !t.done) complete(t);
  else if (d.op === 'update' && d.patch) {
    ['star', 'due', 'allDay', 'est'].forEach(k => { if (k in d.patch) t[k] = d.patch[k]; });
    if ('due' in d.patch) t.notified = false;
    refresh();
  }
}
window.addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.type === 'tab') setTab(e.data.tab, e.data.action);
  if (e.data.type === 'running') document.body.classList.toggle('running', !!e.data.on);
  if (e.data.type === 'task') taskOp(e.data);
});
// 別のタブ・画面でタスクが変わったら読み直す
window.addEventListener('storage', e => {
  if (e.key === KEY) { tasks = read(KEY, []); render(); }
  if (e.key === LOG_KEY) log = read(LOG_KEY, []);
});
window.addEventListener('resize', fitPages);

// Siri（ショートカット）から：?add=明日15時に歯医者 のように開くと追加する
(() => {
  const q = new URLSearchParams(location.search).get('add');
  if (!q) return;
  history.replaceState(null, '', location.pathname + location.hash);
  setTimeout(() => addTask(q), 300);
})();
if (PAGES[location.hash.slice(1)]) setTab(location.hash.slice(1));

/* ───────── 起動 ───────── */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').then(r => { swReg = r; }).catch(() => {});
}
// 時間の経過で表示を更新し、期限が来たら知らせる
setInterval(render, 60e3);
setInterval(checkDue, 20e3);
window.addEventListener('resize', render);
setSpeed(crossMinutes);
render();
checkDue();
setTimeout(checkBackup, 1500);
requestAnimationFrame(tick);
</script>
</body>
</html>
